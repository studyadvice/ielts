<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版面視覺化編輯器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
  :root {
    --bg: #0C0D0C; --panel: #141514; --panel-2: #1B1C1B; --line: #2C2D2B;
    --shell: #C6C7BD; --vanilla: #DBEDD8; --yellow: #E3D322; --pink: #FF91D7; --red: #EF6661;
    --orange: #FF5530; --green: #71CD76; --blue: #5DBAE8; --indigo: #778CE1; --violet: #B484E8; --gray: #86877F;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--shell); }
  body { font-family: "微軟正黑體", "Inter", sans-serif; font-size: 1rem; margin: 0; }
  .app { max-width: 1880px; margin: 0 auto; padding: 20px 28px 60px 28px; }

  /* 頁首 */
  .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 0 16px 0; }
  .top h1 { font-size: 1.5rem; color: var(--vanilla); font-weight: 700; margin: 0; }
  .tabs { display: flex; gap: 6px; }
  .tab { background: var(--panel-2); color: var(--shell); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  .tab.on { background: var(--blue); color: var(--bg); border-color: var(--blue); font-weight: 700; }
  .top .spacer { flex: 1; }
  .btnx { background: var(--panel-2); color: var(--shell); border: 1px solid var(--line); border-radius: 6px;
          padding: 6px 12px; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btnx:hover { border-color: var(--blue); color: var(--vanilla); }
  .btnx.pri { background: var(--blue); color: var(--bg); border-color: var(--blue); font-weight: 600; }
  .btnx.pri:hover { background: var(--vanilla); border-color: var(--vanilla); color: var(--bg); }
  .btnx.dan:hover { border-color: var(--red); color: var(--red); }
  .btnx.sm { padding: 3px 8px; font-size: 0.8rem; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .presets .lbl { color: var(--gray); font-size: 0.85rem; margin: 0 4px 0 0; }

  /* 編輯區 */
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; align-items: start; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .box-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line);
           color: var(--vanilla); font-weight: 600; font-size: 0.95rem; flex-wrap: wrap; }
  .box-h .sub { color: var(--gray); font-weight: 400; font-size: 0.8rem; }
  .box-b { padding: 14px; }
  .structure { min-height: 360px; max-height: 760px; overflow: auto; }
  .inspector { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }

  /* 結構：ui-table */
  .st-item { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px 0; background: var(--panel-2); }
  .st-item.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .st-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; flex-wrap: wrap; }
  .st-tag { font-family: Consolas, monospace; font-size: 0.8rem; color: var(--violet); }
  .st-head .grow { flex: 1; }
  .chip { font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--gray); white-space: nowrap; }
  .chip.c-blue { border-color: var(--blue); color: var(--blue); }
  .chip.c-pink { border-color: var(--pink); color: var(--pink); }
  .chip.c-green { border-color: var(--green); color: var(--green); }
  .chip.c-orange { border-color: var(--orange); color: var(--orange); }
  .chip.c-violet { border-color: var(--violet); color: var(--violet); }
  .chip.c-yellow { border-color: var(--yellow); color: var(--yellow); }
  .warn { color: var(--red); font-size: 0.78rem; padding: 0 10px 6px 10px; }
  .warn i { margin: 0 4px 0 0; }
  .st-cells { display: grid; gap: 6px; padding: 0 10px 10px 10px; }
  .st-cell { border: 1px dashed #3A3B38; border-radius: 6px; padding: 8px 10px; min-height: 54px; cursor: pointer;
             font-size: 0.88rem; line-height: 1.5; overflow: hidden; background: var(--panel); }
  .st-cell:hover { border-color: var(--gray); }
  .st-cell.sel { border: 1px solid var(--pink); box-shadow: 0 0 0 1px var(--pink); }
  .st-cell.inv { background: #26302A; }
  .st-cell .txt { color: var(--shell); word-break: break-word; }
  .st-cell .txt.empty { color: var(--gray); font-style: italic; }
  .st-cell .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0 0; }
  .st-add-col { border: 1px dashed var(--line); border-radius: 6px; color: var(--gray); display: flex; align-items: center;
                justify-content: center; cursor: pointer; min-height: 54px; font-size: 1.2rem; }
  .st-add-col:hover { color: var(--blue); border-color: var(--blue); }
  .st-group { border-left: 4px solid var(--violet); }
  .st-group .st-head { padding: 10px; }
  .st-tools { display: inline-flex; gap: 4px; }
  .ico { background: transparent; border: 1px solid transparent; color: var(--gray); border-radius: 4px; padding: 1px 6px; cursor: pointer; font-size: 0.85rem; }
  .ico:hover { color: var(--vanilla); border-color: var(--line); }
  .ico.dan:hover { color: var(--red); border-color: var(--red); }
  .st-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px 0; }
  .st-table-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line);
                   border-radius: 8px; margin: 0 0 10px 0; cursor: pointer; background: var(--panel-2); }
  .st-table-head.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .empty-hint { color: var(--gray); padding: 24px; text-align: center; }

  /* 結構：info-region */
  .st-region { display: flex; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px 0; background: var(--panel-2); cursor: pointer; overflow: hidden; }
  .st-region.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .st-region .bar { width: 6px; flex: none; }
  .st-region .main { flex: 1; padding: 8px 12px; min-width: 0; }
  .st-region .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .st-region .rid { font-family: Consolas, monospace; color: var(--vanilla); font-size: 0.85rem; }
  .st-region .txt { color: var(--shell); font-size: 0.88rem; margin: 4px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-flow { color: var(--gray); font-size: 0.8rem; text-align: center; margin: -4px 0 4px 0; }

  /* 屬性面板 */
  .fsec { color: var(--yellow); font-size: 0.8rem; letter-spacing: 0.05em; margin: 14px 0 6px 0; padding: 0 0 4px 0; border-bottom: 1px solid var(--line); }
  .fsec:first-child { margin-top: 0; }
  .frow { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; align-items: center; margin: 0 0 8px 0; }
  .frow.full { grid-template-columns: 1fr; }
  .frow label { font-size: 0.85rem; color: var(--shell); }
  .frow label small { display: block; color: var(--gray); font-size: 0.72rem; font-family: Consolas, monospace; }
  .frow input[type=text], .frow select, .frow textarea {
    width: 100%; background: var(--bg); color: var(--vanilla); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 0.9rem; font-family: inherit; }
  .frow textarea { font-family: Consolas, "微軟正黑體", monospace; font-size: 0.85rem; line-height: 1.5; resize: vertical; }
  .frow input:focus, .frow select:focus, .frow textarea:focus { outline: none; border-color: var(--blue); }
  .frow .colorbox { display: flex; gap: 6px; align-items: center; }
  .frow .sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
  .frow .chk { display: flex; align-items: center; gap: 6px; }
  .frow .chk input { width: 16px; height: 16px; accent-color: #5DBAE8; }
  .frow .hint { grid-column: 2; color: var(--gray); font-size: 0.75rem; margin: -4px 0 0 0; }
  .frow.full .hint { grid-column: 1; }
  .inline-btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0 0; }
  .insp-title { color: var(--vanilla); font-weight: 700; font-size: 1rem; margin: 0 0 4px 0; }
  .insp-sub { color: var(--gray); font-size: 0.8rem; margin: 0 0 12px 0; }

  /* 預覽與程式碼 */
  .out { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin: 20px 0 0 0; align-items: start; }
  .preview-frame { width: 100%; border: 0; display: block; min-height: 200px; background: var(--bg); border-radius: 0 0 10px 10px; }
  pre.code { margin: 0; padding: 14px; background: #101110; color: var(--vanilla); font-size: 0.82rem; line-height: 1.6;
             white-space: pre-wrap; word-break: break-word; max-height: 720px; overflow: auto; border-radius: 0 0 10px 10px;
             font-family: Consolas, monospace; }
  pre.code .t { color: var(--blue); }
  pre.code .a { color: var(--violet); }
  pre.code .v { color: var(--green); }
  pre.code .cm { color: var(--gray); }

  /* 提示訊息（Bootstrap alert） */
  .toast-zone { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: 360px; }
  .toast-zone .alert { margin: 0; background: #1B1C1B; color: var(--vanilla); border: 1px solid var(--green); font-size: 0.9rem; padding: 10px 40px 10px 14px; }
  .toast-zone .alert.alert-warning { border-color: var(--orange); }
  .toast-zone .alert.alert-danger { border-color: var(--red); }
  .toast-zone .btn-close { filter: invert(1); }

  /* 匯入視窗 */
  .modal-x { position: fixed; inset: 0; background: rgba(12, 13, 12, 0.88); z-index: 1500; display: none; align-items: center; justify-content: center; }
  .modal-x.on { display: flex; }
  .modal-x .dlg { width: min(1100px, 94vw); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .modal-x h2 { font-size: 1.15rem; color: var(--vanilla); margin: 0 0 6px 0; }
  .modal-x p { color: var(--gray); font-size: 0.85rem; margin: 0 0 10px 0; }
  .modal-x textarea { width: 100%; background: var(--bg); color: var(--vanilla); border: 1px solid var(--line); border-radius: 6px;
                      padding: 10px; font-family: Consolas, monospace; font-size: 0.85rem; }
  .modal-x .acts { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 0 0; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1><i class="bi bi-grid-1x2"></i> 版面視覺化編輯器</h1>
    <div class="tabs">
      <button class="tab on" data-tab="table">ui-table 表格</button>
      <button class="tab" data-tab="info">info-region 逐步區塊</button>
    </div>
    <div class="spacer"></div>
    <button class="btnx" id="btn-import"><i class="bi bi-box-arrow-in-down"></i>匯入程式碼</button>
    <button class="btnx dan" id="btn-clear"><i class="bi bi-trash3"></i>清空</button>
  </div>
  <div class="presets" id="presets"></div>

  <div class="work" style="margin-top:14px">
    <section class="box">
      <div class="box-h"><i class="bi bi-diagram-3"></i>版面結構 <span class="sub" id="struct-sub">點格子或列，右側調整屬性</span></div>
      <div class="box-b structure" id="structure"></div>
    </section>
    <aside class="box inspector">
      <div class="box-h"><i class="bi bi-sliders"></i>屬性</div>
      <div class="box-b" id="inspector"></div>
    </aside>
  </div>

  <div class="out">
    <section class="box">
      <div class="box-h"><i class="bi bi-eye"></i>即時預覽 <span class="grow" style="flex:1"></span>
        <button class="btnx sm" id="btn-reload"><i class="bi bi-arrow-clockwise"></i>重新播放</button></div>
      <iframe class="preview-frame" id="preview" title="預覽"></iframe>
    </section>
    <section class="box">
      <div class="box-h"><i class="bi bi-code-slash"></i>程式碼 <span class="grow" style="flex:1"></span>
        <button class="btnx sm" id="btn-copy-part"><i class="bi bi-clipboard"></i>複製元件</button>
        <button class="btnx sm pri" id="btn-copy-full"><i class="bi bi-clipboard-plus"></i>複製含載入</button></div>
      <pre class="code" id="code"></pre>
    </section>
  </div>
</div>

<div class="toast-zone" id="toasts"></div>

<div class="modal-x" id="import-modal">
  <div class="dlg">
    <h2>匯入程式碼</h2>
    <p>貼上含有 &lt;ui-table&gt; 或 &lt;info-region-group&gt; 的 HTML。編輯器不認得的屬性會放進「其他屬性」原樣保留；元件後面的 &lt;template&gt;、隱藏區塊會放進「附加 HTML」。</p>
    <textarea id="import-text" rows="25" spellcheck="false"></textarea>
    <div class="acts">
      <button class="btnx" id="import-cancel">取消</button>
      <button class="btnx pri" id="import-ok"><i class="bi bi-check2"></i>匯入</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── 共用設定 ───────────────────────────────────────── */
  var CDN = 'https://cdn.jsdelivr.net/gh/studyadvice/ielts/';
  var LIBS = {
    table: CDN + 'tbl/ui-table.js',
    info:  CDN + 'info/info-region.js'
  };
  var HEAD_LINKS = [
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">',
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">'
  ];
  var PALETTE = { shell: '#C6C7BD', vanilla: '#DBEDD8', yellow: '#E3D322', pink: '#FF91D7', red: '#EF6661', orange: '#FF5530',
                  green: '#71CD76', blue: '#5DBAE8', indigo: '#778CE1', violet: '#B484E8', gray: '#86877F',
                  key: '#51DBCF', 'key-deep': '#176878', calm: '#A3C4BC', quiet: '#A9B8E0', playful: '#FFA987', urgent: '#FF2E63' };
  var NAMES = Object.keys(PALETTE);

  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function qv(s) { return String(s).replace(/"/g, '&quot;'); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function strip(h) { var d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
  function colorHex(v) { if (!v) return ''; if (PALETTE[v]) return PALETTE[v]; if (v === 'gold') return '#C9973F'; return /^#|^rgb/.test(v) ? v : ''; }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  function toast(msg, type) {
    var z = $('#toasts');
    var a = document.createElement('div');
    a.className = 'alert alert-' + (type || 'success') + ' alert-dismissible';
    a.setAttribute('role', 'alert');
    a.innerHTML = msg + '<button type="button" class="btn-close" aria-label="關閉"></button>';
    a.querySelector('.btn-close').onclick = function () { a.remove(); };
    z.appendChild(a);
    setTimeout(function () { a.remove(); }, 3200);

  /* ── 屬性欄位定義 ────────────────────────────────────── */

      { k: 'row-border', l: '每列外框', t: 'select', o: ['', '1px solid', '1px dashed', '2px solid'] },
      { k: 'hover-bg-color', l: '滑過底色', t: 'color' },
      { k: 'cell-min-height', l: '格子最小高度', t: 'text', ph: '48px' },
      { s: '對齊' },
      { k: 'cell-alignment', l: '水平對齊', t: 'select', o: ['', 'left', 'center', 'right'] },
      { k: 'vertical-alignment', l: '垂直對齊', t: 'select', o: ['', 'top', 'middle', 'bottom'] },
      { s: '揭示' },
      { k: 'auto-reveal-interval', l: '自動揭示間隔', t: 'text', ph: '1500', h: '毫秒。hidden 的列依序出現' },
      { s: 'toggle 與滑過顯示（整張表的預設）' },
      { k: 'toggle-icon', l: 'toggle 收合圖示', t: 'text', ph: 'bi-chevron-down' },
      { k: 'toggle-icon-open', l: 'toggle 展開圖示', t: 'text', ph: 'bi-chevron-up' },
      { k: 'toggle-color', l: 'toggle 色彩', t: 'color' },
      { k: 'hover-target', l: '滑過內容放置 id', t: 'text', h: '來源與目標元素寫在「附加 HTML」或頁面上' },
      { s: '樹狀（進階列巢狀時）' },
      { k: 'tree-icon', l: '展開鈕圖示', t: 'select', o: ['', 'chevron', 'caret', 'plus'] },
      { k: 'tree-line', l: '導引線', t: 'bool' },
      { k: 'tree-open', l: '全部展開', t: 'bool' }
    ],
    group: [
      { s: '群組' },
      { k: 'title-left', l: '左側標題', t: 'text' },
      { k: 'title-right', l: '右側文字', t: 'text' },
      { k: 'ini-collapse', l: '載入時收合', t: 'bool' }
    ],
    row: [
      { s: '欄寬與框線' },
      { k: 'col-widths', l: '欄寬比例', t: 'text', ph: '1:2:1', h: '數量要等於欄數，否則這一列不會顯示', act: 'even' },
      { k: 'cell-padding', l: '內距', t: 'text', ph: '10px 14px' },
      { k: 'border', l: '外框', t: 'select', o: ['', '1px solid', '1px dashed', '2px solid'] },
      { k: 'col-border', l: '欄間分隔線', t: 'select', o: ['', '1px solid', '1px dashed', '2px solid'] },
      { k: 'min-height', l: '最小高度', t: 'text', ph: '60' },
      { s: '文字' },
      { k: 'font-size', l: '字級', t: 'text', ph: '1.1rem' },
      { k: 'font-color', l: '文字色', t: 'color' },
      { k: 'line-height', l: '行高', t: 'text', ph: '1.8' },
      { k: 'auto-number', l: '自動編號', t: 'select', o: ['', 'outline', 'fill', 'outline-v', 'fill-v'] },

      { k: 'expandable', l: '長文先顯示兩行', t: 'bool' },
      { s: '遮罩' },
      { k: 'mask-text', l: '遮罩文字', t: 'text', ph: '點我揭曉' },
      { k: 'mask-text-2', l: '第二層文字', t: 'text' },

  /* ══ 屬性面板 ════════════════════════════════════════ */

        h.push('<div class="insp-title">區塊 #' + esc(r.a.id) + '</div><div class="insp-sub">第 ' + (s2.i + 1) + ' 個 &lt;info-region&gt;。</div>');

  /* 面板輸入 → 模型 */
  function target() {
    if (S.tab === 'table') {
      var s = S.sel.table, t = S.table;
      if (s.type === 'table') return t;
      if (s.type === 'item') return t.items[s.i];

  }
  function onField(e) {

    else if (k === '_items') o.items = v;
    else if (k === '_nested') o.nested = v;
    else if (k === '_tag') { o.tag = v; rebuild = true; }
    else if (k === '_mode') { o.mode = v; rebuild = true; }
    else if (k === '_gold') { o.gold = v; if (v && !o.a.color) o.a.color = 'gold'; }
    else if (k === '_choices') { o.choices = v; }
    else if (k === '_layout') o.layout = v;
    else if (k === '_item') o.item = v;
    else if (k === '_ph') o.ph = v;
    else if (k === 'id' && S.tab === 'info') {
      var old = o.a.id; o.a.id = v.trim();
      /* 其他區塊指向舊 id 的地方一起改名 */
      S.info.regions.forEach(function (r) { ['next', 'correct-next', 'wrong-next'].forEach(function (kk) { if (r.a[kk] === old) r.a[kk] = o.a.id; }); });
    }
    else o.a[k] = v;
    if (el.closest('.colorbox')) { var sw = el.closest('.colorbox').querySelector('.sw'); if (sw) sw.style.background = colorHex(v) || 'transparent'; }

  /* ══ 動作 ════════════════════════════════════════════ */
  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return false; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; return true; }
  function adjustWidths(row, op, idx) {
    var cw = (row.a['col-widths'] || '').trim(); if (!cw) return;
    var p = cw.split(':');
    if (op === 'add') p.splice(idx == null ? p.length : idx, 0, '1');
    if (op === 'del') p.splice(idx, 1);
    if (op === 'swap') { var x = p[idx]; p[idx] = p[idx + 1]; p[idx + 1] = x; }
    row.a['col-widths'] = p.filter(Boolean).join(':');
  }
  function doAction(act, i) {
    if (S.tab === 'table') {
      var t = S.table, sel = S.sel.table;
      if (act === 'add-row' || act === 'add-enh') {
        var last = null; t.items.forEach(function (x) { if (x.kind === 'row') last = x; });
        var n = last ? last.cols.length : 2;
        var r = newRow(act === 'add-enh' ? 'ui-row-enhance' : 'ui-row', n, last ? last.a['col-widths'] : '');
        if (last) { r.a = clone(last.a); delete r.a.hidden; }
        var at = sel.type !== 'table' ? sel.i + 1 : t.items.length;
        t.items.splice(at, 0, r); S.sel.table = { type: 'item', i: at };
      } else if (act === 'add-group') {
        var at2 = sel.type !== 'table' ? sel.i + 1 : 0;
        t.items.splice(at2, 0, { kind: 'group', a: { 'title-left': '新群組' }, extra: '' }); S.sel.table = { type: 'item', i: at2 };
      } else if (act === 'up' || act === 'down') {
        if (move(t.items, i, act === 'up' ? -1 : 1)) S.sel.table = { type: 'item', i: i + (act === 'up' ? -1 : 1) };
      } else if (act === 'dup') {
        t.items.splice(i + 1, 0, clone(t.items[i])); S.sel.table = { type: 'item', i: i + 1 };
      } else if (act === 'del') {
        t.items.splice(i, 1); S.sel.table = { type: 'table' };
      } else if (act === 'add-col') {
        var row = t.items[i];
        if (row.tag === 'ui-row') {
          /* 一般列的欄數要一致：所有一般列一起加一欄 */
          var nRows = 0;
          t.items.forEach(function (x) { if (x.kind === 'row' && x.tag === 'ui-row' && !x.cols.some(function (c) { return c.a.span; })) { x.cols.push(newCell('')); adjustWidths(x, 'add'); nRows++; } });
          if (nRows > 1) toast('一般列的欄數要一致，已替 ' + nRows + ' 個一般列各加一欄。');
        } else { row.cols.push(newCell('')); adjustWidths(row, 'add'); }
        S.sel.table = { type: 'cell', i: i, c: row.cols.length - 1 };
      } else if (/^cell-|^col-/.test(act)) {
        var rw = t.items[sel.i], c = sel.c;
        if (act === 'cell-del') { rw.cols.splice(c, 1); adjustWidths(rw, 'del', c); S.sel.table = { type: 'item', i: sel.i }; }
        if (act === 'col-del') {
          var nd = 0;
          t.items.forEach(function (x) { if (x.kind === 'row' && x.tag === rw.tag && x.cols.length > c && !x.cols.some(function (cc) { return cc.a.span; })) { x.cols.splice(c, 1); adjustWidths(x, 'del', c); nd++; } });
          if (!rw.cols.length || nd === 0) { /* 只有自己 */ }
          S.sel.table = { type: 'item', i: sel.i };
          toast('已刪除 ' + nd + ' 列的第 ' + (c + 1) + ' 欄。', 'warning');
        }
        if (act === 'cell-dup') { rw.cols.splice(c + 1, 0, clone(rw.cols[c])); adjustWidths(rw, 'add', c + 1); S.sel.table = { type: 'cell', i: sel.i, c: c + 1 }; }
        if (act === 'cell-left' && c > 0) { move(rw.cols, c, -1); adjustWidths(rw, 'swap', c - 1); S.sel.table = { type: 'cell', i: sel.i, c: c - 1 }; }
        if (act === 'cell-right' && c < rw.cols.length - 1) { move(rw.cols, c, 1); adjustWidths(rw, 'swap', c); S.sel.table = { type: 'cell', i: sel.i, c: c + 1 }; }
        if (act === 'col-apply') {
          var src = rw.cols[c], keys = ['font-color', 'inverse', 'icon', 'fixed', 'mask-gradient', 'mask-color', 'mask-invert', 'arrow-color'];
          var cnt = 0;
          t.items.forEach(function (x, xi) {
            if (x.kind !== 'row' || xi === sel.i || !x.cols[c]) return;
            keys.forEach(function (k) { if (src.a[k] !== undefined) x.cols[c].a[k] = src.a[k]; else delete x.cols[c].a[k]; });
            cnt++;
          });
          toast('已把這格的文字色、反白、圖示等外觀套用到同一欄的其他 ' + cnt + ' 格。');
        }
      } else if (act === 'even') {
        var rr = t.items[sel.i]; rr.a['col-widths'] = rr.cols.map(function () { return '1'; }).join(':');
      }
    } else {
      var m = S.info;
      if (act === 'add-region' || act === 'add-quiz' || act === 'add-gold' || act === 'add-fill') {
        var r2 = newRegion(nextId(m), act === 'add-quiz' ? 'quiz' : act === 'add-fill' ? 'fill' : act === 'add-gold' ? 'end' : 'manual');
        if (act === 'add-fill') { r2.content = '<p>題目</p>'; r2.a.answer = ''; r2.ph = '請輸入答案'; r2.a['quiz-label'] = '填空'; }
        if (act === 'add-quiz') { r2.content = '<p>題目</p>'; r2.choices = '選項一\n選項二\n選項三'; r2.a['quiz-label'] = '第 ' + (m.regions.filter(function (x) { return x.mode === 'quiz'; }).length + 1) + ' 題'; r2.layout = 'column'; }
        if (act === 'add-gold') { r2.gold = true; r2.a.color = 'gold'; r2.content = '<h4>完成</h4>'; }
        var s3 = S.sel.info, at3 = s3.type === 'region' ? s3.i + 1 : m.regions.length;
        m.regions.splice(at3, 0, r2); S.sel.info = { type: 'region', i: at3 };
      } else if (act === 'up' || act === 'down') {
        if (move(m.regions, i, act === 'up' ? -1 : 1)) S.sel.info = { type: 'region', i: i + (act === 'up' ? -1 : 1) };
      } else if (act === 'dup') {
        var cp = clone(m.regions[i]); cp.a.id = 'r' + nextId(m); m.regions.splice(i + 1, 0, cp); S.sel.info = { type: 'region', i: i + 1 };
      } else if (act === 'del') {
        m.regions.splice(i, 1); S.sel.info = { type: 'group' };
      }
    }
    refresh(true);
  }

  function highlight(code) {
    return code.replace(/(<!--[\s\S]*?-->)|(<\/?[\w-]+(?:"[^"]*"|[^>"])*>)|([^<]+|<)/g, function (m, cm, tag, txt) {

      });

  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.uibPreview === pvToken) $('#preview').style.height = Math.max(200, e.data.h + 4) + 'px';
  });
  function renderCode() { $('#code').innerHTML = highlight(currentHTML()); }

  function refresh(full) {
    if (S.tab === 'table') renderTableStructure(); else renderInfoStructure();
    if (full) renderInspector();
    renderCode(); renderPreview(); save();
  }

  function renderPresets() {
    var P = S.tab === 'table' ? TABLE_PRESETS : INFO_PRESETS;
    $('#presets').innerHTML = '<span class="lbl"><i class="bi bi-lightning-charge"></i> 快速範本</span>' +
      Object.keys(P).map(function (k) { return '<button class="btnx sm" data-preset="' + esc(k) + '">' + esc(k) + '</button>'; }).join('');
  }
  function setTab(tab) {
    S.tab = tab;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    $('#struct-sub').textContent = tab === 'table' ? '點格子或列，右側調整屬性' : '點區塊，右側調整內容與流程';
    renderPresets(); refresh(true);
  }

  function copy(text, msg) {
    var done = function () { toast(msg); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('無法自動複製，請手動選取程式碼。', 'warning'); }
      ta.remove();
    }
  }

  /* ══ 事件綁定 ════════════════════════════════════════ */
  $('#structure').addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (a) { e.stopPropagation(); doAction(a.getAttribute('data-act'), +a.getAttribute('data-i')); return; }
    var p = e.target.closest('[data-pick]');
    if (!p) return;
    var kind = p.getAttribute('data-pick'), i = +p.getAttribute('data-i');
    if (S.tab === 'table') S.sel.table = kind === 'cell' ? { type: 'cell', i: i, c: +p.getAttribute('data-c') } : kind === 'item' ? { type: 'item', i: i } : { type: 'table' };
    else S.sel.info = kind === 'region' ? { type: 'region', i: i } : { type: 'group' };
    refresh(true);
  });
  $('#inspector').addEventListener('input', onField);
  $('#inspector').addEventListener('change', function (e) { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.getAttribute('data-k') === '_choices') onField(e); });
  $('#inspector').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (b) { doAction(b.getAttribute('data-act'), +b.getAttribute('data-i')); return; }
    if (e.target.closest('[data-even]')) doAction('even');
  });
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { setTab(b.getAttribute('data-tab')); }; });
  $('#presets').addEventListener('click', function (e) {
    var b = e.target.closest('[data-preset]'); if (!b) return;
    var k = b.getAttribute('data-preset');
    if (S.tab === 'table') { S.table = TABLE_PRESETS[k](); S.sel.table = { type: 'table' }; }
    else { S.info = INFO_PRESETS[k](); S.sel.info = { type: 'group' }; }
    refresh(true); toast('已載入範本「' + k + '」。');
  });
  $('#btn-clear').onclick = function () {
    if (S.tab === 'table') { S.table = tableDefault(); S.table.items.push(newRow('ui-row', 2, '1:1')); S.sel.table = { type: 'table' }; }
    else { S.info = infoDefault(); S.info.regions.push(newRegion(1, 'end')); S.sel.info = { type: 'group' }; }
    refresh(true); toast('已清空，留下一個起點。', 'warning');
  };
  $('#btn-reload').onclick = function () { pvToken++; renderPreview(); };
  $('#btn-copy-part').onclick = function () { copy(currentHTML(), '已複製元件程式碼。'); };
  $('#btn-copy-full').onclick = function () { copy(fullHTML(), '已複製元件與載入用的 link、script。'); };
  $('#btn-import').onclick = function () { $('#import-text').value = currentHTML(); $('#import-modal').classList.add('on'); $('#import-text').focus(); };
  $('#import-cancel').onclick = function () { $('#import-modal').classList.remove('on'); };
  $('#import-ok').onclick = function () {
    var txt = $('#import-text').value;
    var t = parseTable(txt), m = parseInfo(txt);
    if (t) { S.table = t; S.sel.table = { type: 'table' }; setTab('table'); toast('已匯入 ui-table，共 ' + t.items.length + ' 個列與群組。'); }
    else if (m) { S.info = m; S.sel.info = { type: 'group' }; setTab('info'); toast('已匯入 info-region，共 ' + m.regions.length + ' 個區塊。'); }
    else { toast('找不到 &lt;ui-table&gt; 或 &lt;info-region&gt;。', 'danger'); return; }
    $('#import-modal').classList.remove('on');
  };

  window.UiBuilder = { state: S, tableToHTML: tableToHTML, infoToHTML: infoToHTML, parseTable: parseTable, parseInfo: parseInfo, setTab: setTab };
  setTab(S.tab);
})();
</script>
</body>
</html>
