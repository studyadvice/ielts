<div class="page">
  <h1>ui-blank：CLI 模式</h1>
  <p class="sub"><code>&lt;ui-blank mode="cli"&gt;</code> 把元件變成模擬的終端機畫面，用子標籤寫成一份「輸入、回應」交替的劇本，自動逐字打出來，看起來像在和電腦對話。內容不必是真實指令。劇本中可以插入 <code>&lt;cli-ask&gt;</code> 換使用者自己打，打什麼都接受，按 Enter 就繼續播放。每個範例左邊是實際元件，右邊是同一段原始碼。</p>
  <nav class="toc">
    <a href="#basic">自動播放對話</a><a href="#ask">換使用者輸入</a><a href="#look">外觀</a><a href="#speed">速度</a><a href="#ref">屬性速查</a><a href="#history">修改紀錄</a>
  </nav>

  <section class="part" id="basic">
    <h2>自動播放對話</h2>
    <p class="lead">元件完整進入畫面時開始播放。<code>&lt;cli-in&gt;</code> 是打字的輸入行，<code>&lt;cli-out&gt;</code> 是系統回應；每一行都能用 <code>prompt</code> 換提示符號，寫成角色名稱就像兩個人在對話。下方控制列可以暫停、重播、快轉與切換 0.5×、1×、2× 速度。</p>
    <div class="demo" data-demo>
      <h3>IELTS Part 1：hometown</h3>
      <div class="grid2">
        <div class="stage"></div>
        <div class="side"><p class="cap">HTML</p><pre class="code-box"><code></code></pre></div>
      </div>
      <script type="text/plain" class="demo-src">
<ui-blank mode="cli" title="ielts-speaking" prompt="examiner $">
  <cli-in>Let's talk about your hometown. Where is it?</cli-in>
  <cli-out>Loading candidate.memories ... done</cli-out>
  <cli-in prompt="you $">It's Kaohsiung, a harbour city in southern Taiwan.</cli-in>
  <cli-in>What do you like most about it?</cli-in>
  <cli-in prompt="you $">The seafood, definitely. And the weather is warm all year round.</cli-in>
  <cli-out theme="green">[band 7] good use of "definitely" + reason</cli-out>
</ui-blank>
<\/script>
    </div>
  </section>

  <section class="part" id="ask">
    <h2>換使用者輸入</h2>
    <p class="lead">播放到 <code>&lt;cli-ask&gt;</code> 會停下來等使用者打字，不比對答案，按 Enter 就繼續。<code>placeholder</code> 是灰色提示字；<code>sample</code> 是示範句，作答時按「略過」會自動打出來。方向鍵上下可叫回先前的輸入，中文輸入法也能正常選字。右下角的通知是監聽 <code>cli-answer</code> 事件的結果。</p>
    <div class="demo" data-demo>
      <h3>示範後換人回答</h3>
      <div class="grid2">
        <div class="stage"></div>
        <div class="side"><p class="cap">HTML</p><pre class="code-box"><code></code></pre></div>
      </div>
      <script type="text/plain" class="demo-src">
<ui-blank mode="cli" title="practice" prompt="examiner $">
  <cli-in>Do you prefer mornings or evenings?</cli-in>
  <cli-in prompt="model $">I'm definitely a morning person. I usually go jogging before work.</cli-in>
  <cli-out>Now it's your turn.</cli-out>
  <cli-in>What do you usually do at the weekend?</cli-in>
  <cli-ask prompt="you $" placeholder="type your answer and press Enter"
           sample="I usually catch up with friends over brunch."></cli-ask>
  <cli-out theme="key">Thanks! Answer saved.</cli-out>
</ui-blank>
<\/script>
    </div>
  </section>

  <section class="part" id="look">
    <h2>外觀</h2>
    <p class="lead"><code>frame</code> 可選 <code>mac</code>（預設）、<code>win</code>、<code>none</code>；<code>cursor</code> 可選 <code>block</code>、<code>underline</code>、<code>bar</code>。設定 <code>height</code> 後畫面固定高度並自動捲到最後一行。行內可用 <code>&lt;c-key&gt;</code> 等色名標籤，<code>pre</code> 保留原始換行與空白。</p>
    <div class="demo" data-demo>
      <h3>Windows 外框、底線游標、固定高度</h3>
      <div class="grid2">
        <div class="stage"></div>
        <div class="side"><p class="cap">HTML</p><pre class="code-box"><code></code></pre></div>
      </div>
      <script type="text/plain" class="demo-src">
<ui-blank mode="cli" frame="win" bar-color="indigo" title-color="background" cursor="underline" title="C:\vocab" prompt="C:\vocab&gt;"
          prompt-color="yellow" height="170">
  <cli-in>show collocations "make"</cli-in>
  <cli-out pre>
    make a decision     做決定
    make progress       進步
    make an effort      努力
  </cli-out>
  <cli-in>compare make do</cli-in>
  <cli-out><c-pink>make</c-pink> = create something new; <c-key>do</c-key> = perform a task</cli-out>
  <cli-in>example</cli-in>
  <cli-out>I need to <c-pink>make</c-pink> a decision before I <c-key>do</c-key> my homework.</cli-out>
</ui-blank>
<\/script>
    </div>
    <div class="demo" data-demo>
      <h3>不加外框、細直線游標、隱藏控制列</h3>
      <div class="grid2">
        <div class="stage"></div>
        <div class="side"><p class="cap">HTML</p><pre class="code-box"><code></code></pre></div>
      </div>
      <script type="text/plain" class="demo-src">
<ui-blank mode="cli" frame="none" cursor="bar" controls="false" prompt="&gt;"
          prompt-color="energetic" in-color="vanilla" out-color="violet" font-size="1.25rem">
  <cli-in>translate 我很期待見到你</cli-in>
  <cli-out>I'm looking forward to seeing you.</cli-out>
  <cli-wait ms="600"></cli-wait>
  <cli-out theme="playful">tip: look forward to + V-ing</cli-out>
</ui-blank>
<\/script>
    </div>
  </section>

  <section class="part" id="speed">
    <h2>速度</h2>
    <p class="lead"><code>speed</code> 是輸入行每秒打幾個字（預設 20），<code>out-speed</code> 是系統回應每秒出現幾個字（預設 120，<code>0</code> 為整段直接出現），<code>line-delay</code> 是每行之間的停頓毫秒數。單一行也能用 <code>speed</code>、<code>delay</code> 覆蓋。<code>humanize="false"</code> 關閉打字的隨機快慢。<code>autoplay="false"</code> 時按 ▶ 或點畫面才開始。</p>
    <div class="demo" data-demo>
      <h3>慢速打字、回應直接出現、手動開始</h3>
      <div class="grid2">
        <div class="stage"></div>
        <div class="side"><p class="cap">HTML</p><pre class="code-box"><code></code></pre></div>
      </div>
      <script type="text/plain" class="demo-src">
<ui-blank mode="cli" speed="9" out-speed="0" line-delay="900" autoplay="false" prompt="you $">
  <cli-in>Describe a place you visited recently.</cli-in>
  <cli-out>Thinking...</cli-out>
  <cli-in speed="30" delay="300">I went to Tainan last month with my family.</cli-in>
  <cli-out theme="green">Good opening: time + people.</cli-out>
</ui-blank>
<\/script>
    </div>
  </section>

  <section class="part" id="ref">
    <h2>屬性速查</h2>
    <p class="ref-title">&lt;ui-blank mode="cli"&gt;</p>
    <table class="ref">
      <thead><tr><th style="width:200px">屬性</th><th style="width:200px">預設</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td><code>mode</code></td><td>無</td><td>設為 <code>cli</code> 啟用 CLI 模式；其他值或不設定為原本的填充題。</td></tr>
        <tr><td><code>prompt</code></td><td><code>$</code></td><td>預設提示符號，每一行可用自己的 <code>prompt</code> 覆蓋；設為空字串則不顯示。</td></tr>
        <tr><td><code>speed</code></td><td><code>20</code></td><td>輸入行每秒打幾個字。</td></tr>
        <tr><td><code>out-speed</code></td><td><code>120</code></td><td>系統回應每秒出現幾個字，<code>0</code> 為整段直接出現。</td></tr>
        <tr><td><code>line-delay</code></td><td><code>450</code></td><td>每一行輸入之前的停頓（毫秒）。</td></tr>
        <tr><td><code>humanize</code></td><td>開啟</td><td>打字帶隨機快慢，遇到空白與標點稍微停頓；<code>false</code> 為等速。</td></tr>
        <tr><td><code>autoplay</code></td><td>自動</td><td>元件完整進入畫面時開始；<code>false</code> 時按 ▶ 或點畫面才開始。</td></tr>
        <tr><td><code>controls</code></td><td>顯示</td><td>控制列：播放／暫停、重播、快轉（作答時為略過）、0.5×、1×、2×；<code>false</code> 隱藏。</td></tr>
        <tr><td><code>frame</code></td><td><code>mac</code></td><td>外框：<code>mac</code>、<code>win</code>、<code>none</code>。</td></tr>
        <tr><td><code>title</code></td><td><code>terminal</code></td><td>標題列文字。</td></tr>
        <tr><td><code>bar-color</code>、<code>title-color</code></td><td><code>bg-alternative</code>、<code>shell</code></td><td>標題列底色與標題文字色。</td></tr>
        <tr><td><code>cursor</code></td><td><code>block</code></td><td>游標：<code>block</code>、<code>underline</code>、<code>bar</code>。打字時不閃爍，停下來才閃爍。</td></tr>
        <tr><td><code>end-prompt</code></td><td>顯示</td><td>播完後在最後留一個提示符號與閃爍游標；<code>false</code> 不留。</td></tr>
        <tr><td><code>width</code></td><td><code>100%</code></td><td>最大寬度。</td></tr>
        <tr><td><code>height</code>、<code>min-height</code></td><td>自動、<code>160</code></td><td>畫面高度；設定 <code>height</code> 後固定高度並自動捲到最後一行。純數字視為 px。</td></tr>
        <tr><td><code>font-size</code></td><td><code>1rem</code></td><td>畫面字級。</td></tr>
        <tr><td><code>bg-color</code>、<code>text-color</code></td><td><code>#0C0D0C</code>、<code>shell</code></td><td>畫面底色與一般文字色。</td></tr>
        <tr><td><code>prompt-color</code></td><td><code>key</code></td><td>提示符號、游標、選中的速度按鈕。</td></tr>
        <tr><td><code>in-color</code>、<code>out-color</code>、<code>ask-color</code></td><td><code>vanilla</code>、<code>calm</code>、<code>yellow</code></td><td>輸入行、系統回應、使用者輸入的文字色。</td></tr>
      </tbody>
    </table>
    <p class="ref-title">劇本子標籤</p>
    <table class="ref">
      <thead><tr><th style="width:200px">子標籤</th><th style="width:200px">屬性</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td><code>&lt;cli-in&gt;</code></td><td><code>prompt</code>、<code>speed</code>、<code>delay</code>、<code>theme</code></td><td>自動打字的輸入行。</td></tr>
        <tr><td><code>&lt;cli-out&gt;</code></td><td><code>speed</code>、<code>delay</code>、<code>theme</code>、<code>pre</code></td><td>系統回應，沒有提示符號。<code>delay</code> 預設 250 毫秒；<code>pre</code> 保留原始換行與空白（自動去掉共同縮排）。</td></tr>
        <tr><td><code>&lt;cli-ask&gt;</code></td><td><code>prompt</code>、<code>placeholder</code>、<code>sample</code>、<code>allow-empty</code>、<code>delay</code>、<code>theme</code></td><td>換使用者輸入，不比對答案，按 Enter 繼續；預設不接受空白輸入。</td></tr>
        <tr><td><code>&lt;cli-wait&gt;</code></td><td><code>ms</code></td><td>停頓，預設 800 毫秒。</td></tr>
      </tbody>
    </table>
    <p class="ref-title">事件與方法</p>
    <table class="ref">
      <thead><tr><th style="width:200px">名稱</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td><code>cli-answer</code></td><td>使用者在 <code>&lt;cli-ask&gt;</code> 按下 Enter 或略過時觸發，<code>detail = { value, index }</code>。同時送出原有的 <code>blank-submit</code>，<code>valid</code> 為 <code>null</code>。</td></tr>
        <tr><td><code>cli-end</code></td><td>劇本播完時觸發。</td></tr>
        <tr><td><code>play()</code>、<code>pause()</code>、<code>restart()</code></td><td>播放或繼續、暫停、從頭播放；<code>reset()</code> 等同 <code>restart()</code>。</td></tr>
        <tr><td><code>rate</code></td><td>播放倍率，可讀寫，例如 <code>el.rate = 2</code>。</td></tr>
      </tbody>
    </table>
  </section>

  <section class="part" id="history">
    <h2>修改紀錄：新增 mode="cli"（11-12-26）</h2>
    <p class="lead">原本的 <code>&lt;ui-blank&gt;</code> 填充題完全不受影響；只有加上 <code>mode="cli"</code> 的元件改走 CLI 流程。下面左邊是原本的填充題，右邊是新的 CLI 模式。</p>
    <div class="demo" data-demo>
      <h3>原本的填充題（未設定 mode）</h3>
      <div class="grid2">
        <div class="stage"></div>
        <div class="side"><p class="cap">HTML</p><pre class="code-box"><code></code></pre></div>
      </div>
      <script type="text/plain" class="demo-src">
<p class="bp-text-shell">I usually go _____ before work.</p>
<ui-blank expected-value="jogging" button-icon="bi-send" label-valid="Correct!"></ui-blank>
<\/script>
    </div>
    <div class="grid2">
      <div class="side"><p class="cap">修改前：只有填充題</p><pre class="code-box"><code>connectedCallback() {
  injectBlankStyleOnce();
  if (!this._built) this._build();
  ...
}</code></pre></div>
      <div class="side"><p class="cap">修改後：mode="cli" 改走 CLI 流程</p><pre class="code-box"><code>connectedCallback() {
  if (this.getAttribute('mode') === 'cli') {
    if (this._cliBuilt) return;
    injectCliStyleOnce();
    // 文件還在解析時，等解析完成再讀取劇本
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ...);
    } else {
      this._cliInit();
    }
    return;
  }
  injectBlankStyleOnce();
  if (!this._built) this._build();
  ...
}

/* CLI 方法集中在 CLI_METHODS，掛到 UiBlank.prototype */
Object.defineProperties(UiBlank.prototype,
  Object.getOwnPropertyDescriptors(CLI_METHODS));</code></pre></div>
    </div>
  </section>
</div>

<script>
/* 由同一段原始碼同時產生實例與程式碼，確保範例與程式碼一致 */
(() => {
  const dedent = s => {
    const lines = s.replace(/^\n+|\s+$/g, '').split('\n');
    const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^\s*/)[0].length));
    return lines.map(l => l.slice(ind)).join('\n');
  };
  document.querySelectorAll('[data-demo]').forEach(d => {
    const src = d.querySelector('.demo-src');
    if (!src) return;
    const html = dedent(src.textContent);
    d.querySelector('.stage').innerHTML = html;
    d.querySelector('.code-box code').textContent = html;
  });
})();
<\/script>
<script src="ui-inputs.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"><\/script>
<script>
/* 以 Bootstrap alert 顯示 cli-answer 事件，不使用 alert() */
document.addEventListener('cli-answer', (e) => {
  const log = document.getElementById('log');
  const box = document.createElement('div');
  box.className = 'alert alert-dismissible fade show';
  box.setAttribute('role', 'alert');
  box.innerHTML = 'cli-answer：<b></b>'
    + '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="關閉"></button>';
  box.querySelector('b').textContent = e.detail.value || '（略過）';
  log.appendChild(box);
  while (log.children.length > 3) log.firstElementChild.remove();
  setTimeout(() => {
    if (!box.isConnected) return;
    if (window.bootstrap) bootstrap.Alert.getOrCreateInstance(box).close(); else box.remove();
  }, 5000);
});
<\/script>
</body>
</html>

</script>
<script type="text/plain" id="src-10-23-26">
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>ui-inputs 示範</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
  body{
    background:#0C0D0C;
    color:#C6C7BD;
    font-size:1.125rem;
    line-height:1.5;
    font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
    max-width:760px;
    margin:40px auto;
    padding:0 24px 80px;
  }
  h1{ color:#B484E8; }
  h2{ color:#5DBAE8; margin-top:48px; font-size:1.3rem; }
  p.desc{ color:rgba(198,199,189,0.85); max-width:640px; }
  code{ color:#E3D322; }
  .panel{ margin:16px 0 8px; }
  .hint{ font-size:0.9rem; color:rgba(198,199,189,0.6); }
  button.go{
    margin-top:12px;
    padding:8px 18px;
    border-radius:6px;
    border:1px solid rgba(198,199,189,0.78);
    background:transparent;
    color:#C6C7BD;
    cursor:pointer;
  }
</style>
</head>
<body>

<h1>ui-inputs 示範</h1>
<p class="desc">兩個輸入／驗證元件：<code>&lt;ui-otp&gt;</code> 單一 input 版 OTP 輸入／驗證，<code>&lt;ui-blank&gt;</code> 單行輸入填充題（自帶 Bootstrap Icons 送出鈕）。</p>

<h1 style="margin-top:56px;">一、ui-otp</h1>
<p class="desc">點任一格即可聚焦，支援鍵盤輸入、刪除、整段貼上；畫面上的格子只是展示用，實際輸入都發生在背後那個透明的 input 裡。</p>

<h2>1. 預設（numeric，6 碼，無分組）</h2>
<div class="panel">
  <ui-otp length="6" accent-color="blue"></ui-otp>
</div>

<h2>2. 分組 + 分隔符（groups="3,3"，比照 Bootstrap 6 截圖效果）</h2>
<div class="panel">
  <ui-otp length="6" groups="3,3" separator="-" accent-color="violet"></ui-otp>
</div>

<h2>3. 英文字母、強制大寫</h2>
<div class="panel">
  <ui-otp length="4" type="alpha" case="upper" accent-color="green" cell-size="52px"></ui-otp>
  <p class="hint">type="alpha" case="upper"：只接受英文字母，自動轉大寫。</p>
</div>

<h2>4. 前端比對模式（expected-value="123456"，試打 123456 或其他數字）</h2>
<div class="panel">
  <ui-otp
    length="6"
    groups="3,3"
    expected-value="123456"
    label-invalid="驗證碼錯誤，請重新輸入。"
    label-valid="驗證成功！"
    accent-color="blue"
    valid-color="green"
    error-color="red"
  ></ui-otp>
  <p class="hint">填滿 6 碼即自動比對；答對顯示綠框＋成功訊息，答錯顯示紅框＋錯誤訊息。</p>
</div>

<h2>5. 前端比對 + clear-on-invalid（答錯會自動清空重輸）</h2>
<div class="panel">
  <ui-otp
    length="6"
    expected-value="000000"
    clear-on-invalid
    clear-delay="700"
    label-invalid="驗證碼錯誤，請重新輸入一次。"
    accent-color="energetic"
    error-color="red"
  ></ui-otp>
  <p class="hint">正確答案是 000000；輸入其他任何 6 碼都會先閃紅框，約 0.7 秒後（clear-delay="700"）自動清空讓你重打。</p>
</div>

<h2>6. 外部非同步驗證模式（不給 expected-value，自行監聽 otp-complete）</h2>
<div class="panel">
  <ui-otp id="asyncOtp" length="6" accent-color="indigo" show-message="true" label-invalid="伺服器驗證失敗，請重新輸入。"></ui-otp>
  <p class="hint">模擬打 API：輸入 888888 會驗證成功，其他 6 碼會顯示失敗（0.6 秒後才回應，模擬網路延遲）。</p>
</div>

<h2>7. focus ring 粗細／顏色自訂</h2>
<div class="panel">
  <ui-otp length="4" accent-color="pink" focus-ring-width="5px" focus-ring-color="pink" border-color="rgba(198,199,189,0.78)" radius="12px"></ui-otp>
  <p class="hint">focus-ring-width="5px" focus-ring-color="pink"：聚焦中的那一格外框變粗、顏色改用 pink。</p>
</div>

<h2>8. 遮蔽模式（mask，顯示圓點而非實際字元）</h2>
<div class="panel">
  <ui-otp length="6" mask accent-color="green"></ui-otp>
</div>

<h2>9. disabled</h2>
<div class="panel">
  <ui-otp length="6" disabled value-preview="------"></ui-otp>
</div>

<h1 style="margin-top:72px;">一之二、ui-otp mode="generate"（隨機產生＋複製到剪貼簿）</h1>
<p class="desc">同一個 <code>&lt;ui-otp&gt;</code> 標籤，加上 <code>mode="generate"</code> 就變成唯讀展示＋複製功能，不再是輸入框。</p>

<h2>1. 基本生成（預設 16 碼、exclude-ambiguous 預設開啟）</h2>
<div class="panel">
  <ui-otp mode="generate" groups="4,4,4,4" accent-color="blue"></ui-otp>
  <p class="hint">每次重新整理頁面都會是不同的一組碼；已自動排除 0/O、1/I/l 這類容易看錯的字元。</p>
</div>

<h2>2. format 自訂版型（優先於 length/groups）</h2>
<div class="panel">
  <ui-otp mode="generate" format="OOOO-OOOOO-OOOOOO" type="alnum" accent-color="violet"></ui-otp>
</div>

<h2>3. 關閉 exclude-ambiguous + 指定字元集</h2>
<div class="panel">
  <ui-otp mode="generate" length="10" type="numeric" exclude-ambiguous="false" accent-color="energetic"></ui-otp>
  <p class="hint">exclude-ambiguous="false"：允許出現 0、1 這些字元。</p>
</div>

<h2>4. 複製按鈕自訂（文字、位置、圖示）</h2>
<div class="panel">
  <ui-otp mode="generate" length="8" groups="4,4" copy-text="複製" copy-position="left" copy-icon="bi-stickies" copy-icon-success="bi-stickies-fill" accent-color="green"></ui-otp>
</div>

<h2>5. check-url 後端查重（這裡用假的 fetch 模擬，實際請指到你的 PHP）</h2>
<div class="panel">
  <ui-otp id="checkGen" mode="generate" length="6" type="numeric" check-url="/fake/check_code.php" check-max-retries="5" accent-color="green"></ui-otp>
  <p class="hint" id="checkGenHint">模擬後端：前兩次回報「已存在」自動重骰，第三次才通過。打開主控台可以看到 otp-check-* 事件紀錄。</p>
</div>

<script>
  // 只是示範用的假後端，攔截 fetch 到 /fake/check_code.php 的請求。
  // 實際使用時把 check-url 指到你自己的 PHP（例如 check_code.php），
  // 該檔案收到 POST 的 code 參數、查資料庫後回傳 {"exists": true/false} 即可。
  const realFetch = window.fetch;
  let fakeCallCount = 0;
  window.fetch = function (url, options) {
    if (typeof url === 'string' && url.indexOf('/fake/check_code.php') !== -1) {
      fakeCallCount++;
      const exists = fakeCallCount <= 2;
      return Promise.resolve({
        ok: true,
        json: () => Promise.resolve({ exists })
      });
    }
    return realFetch.apply(this, arguments);
  };

  const checkGen = document.getElementById('checkGen');
  ['otp-check-start', 'otp-check-result', 'otp-generated', 'otp-check-exhausted', 'otp-check-error'].forEach((evt) => {
    checkGen.addEventListener(evt, (e) => console.log(evt, e.detail));
  });
<\/script>

<h1 style="margin-top:72px;">二、ui-blank</h1>
<p class="desc">單行輸入填充題，永遠區分大小寫。送出鈕用 Bootstrap Icons（圖示固定不隨結果變化），訊息預設顯示在元件正下方，也可指定顯示在頁面上別的 div。</p>

<h2>1. 基本用法（前端比對，單一正解）</h2>
<div class="panel">
  <ui-blank
    placeholder="請輸入答案"
    expected-value="apple"
    button-icon="bi-send"
    accent-color="blue"
    label-invalid="答案不正確，請再試一次。"
    label-valid="答對了！"
  ></ui-blank>
  <p class="hint">正解是 apple（區分大小寫，Apple 算錯）。</p>
</div>

<h2>2. 多個可接受答案（"|" 分隔）＋ 按鈕文字＋icon-left</h2>
<div class="panel">
  <ui-blank
    placeholder="台北 或 臺北"
    expected-value="台北|臺北"
    button-icon="bi-check2-circle"
    button-text="檢查"
    button-position="icon-left"
    accent-color="violet"
    valid-color="green"
    error-color="red"
  ></ui-blank>
</div>

<h2>3. clear-on-invalid + clear-delay（答錯 0.7 秒後自動清空）</h2>
<div class="panel">
  <ui-blank
    placeholder="輸入 banana"
    expected-value="banana"
    clear-on-invalid
    clear-delay="700"
    button-icon="bi-arrow-right-circle"
    accent-color="energetic"
  ></ui-blank>
</div>

<h2>4. normalize-width（全形轉半形後再比對）</h2>
<div class="panel">
  <ui-blank
    placeholder="輸入 2024（可用全形輸入法打）"
    expected-value="2024"
    normalize-width
    button-icon="bi-send"
    accent-color="green"
  ></ui-blank>
  <p class="hint">用全形輸入法打「２０２４」送出，比對前會自動轉成半形再跟 2024 比對。</p>
</div>

<h2>5. message-style 五種樣式</h2>
<div class="panel">
  <p class="hint">plain（預設）</p>
  <ui-blank id="msgPlain" placeholder="輸入 ok" expected-value="ok" message-style="plain" label-valid="答對了！" button-icon="bi-send" accent-color="blue"></ui-blank>
</div>
<div class="panel">
  <p class="hint">bordered</p>
  <ui-blank id="msgBordered" placeholder="輸入 ok" expected-value="ok" message-style="bordered" label-valid="答對了！" button-icon="bi-send" accent-color="blue"></ui-blank>
</div>
<div class="panel">
  <p class="hint">filled</p>
  <ui-blank id="msgFilled" placeholder="輸入 ok" expected-value="ok" message-style="filled" label-valid="答對了！" button-icon="bi-send" accent-color="blue"></ui-blank>
</div>
<div class="panel">
  <p class="hint">accent-bar</p>
  <ui-blank id="msgAccentBar" placeholder="輸入 ok" expected-value="ok" message-style="accent-bar" label-valid="答對了！" button-icon="bi-send" accent-color="blue"></ui-blank>
</div>
<div class="panel">
  <p class="hint">icon-banner</p>
  <ui-blank id="msgIconBanner" placeholder="輸入 ok" expected-value="ok" message-style="icon-banner" label-valid="答對了！" button-icon="bi-send" accent-color="blue"></ui-blank>
</div>

<h2>6. message-target（訊息顯示在頁面上別的 div，不套用元件樣式）</h2>
<div class="panel">
  <ui-blank id="msgTarget" placeholder="輸入 ok" expected-value="ok" message-target="customMsgBox" button-icon="bi-send" accent-color="pink"></ui-blank>
  <div id="customMsgBox" style="margin-top:8px;font-weight:700;"></div>
  <p class="hint">這個 div 本身的排版（字重、顏色、位置）完全由你自己的 CSS 控制，元件只負責把文字塞進去。</p>
</div>

<h2>7. 外部非同步驗證模式（不給 expected-value）</h2>
<div class="panel">
  <ui-blank id="asyncBlank" placeholder="輸入 remote" button-icon="bi-send" accent-color="indigo" message-style="filled"></ui-blank>
  <p class="hint">模擬打 API：輸入 remote 驗證成功，其他任何內容驗證失敗（0.5 秒後才回應）。</p>
</div>

<script>
  // 範例 6：外部非同步驗證（模擬打 API）
  const asyncOtp = document.getElementById('asyncOtp');
  asyncOtp.addEventListener('otp-complete', (e) => {
    const { value } = e.detail;
    setTimeout(() => {
      asyncOtp.setState(value === '888888' ? 'valid' : 'invalid');
    }, 600);
  });

  // 其餘元件也可以監聽 otp-input / otp-complete 做紀錄
  document.querySelectorAll('ui-otp').forEach((el) => {
    el.addEventListener('otp-complete', (e) => {
      console.log('otp-complete', el.id || '(no id)', e.detail);
    });
  });

  // ui-blank 外部非同步驗證範例
  const asyncBlank = document.getElementById('asyncBlank');
  asyncBlank.addEventListener('blank-submit', (e) => {
    const { value } = e.detail;
    setTimeout(() => {
      asyncBlank.setState(value === 'remote' ? 'valid' : 'invalid');
    }, 500);
  });
<\/script>

<script src="ui-inputs.js"><\/script>
</body>
</html>

</script>

<script>
(function () {
  /* 每個版本的完整原始 HTML 放在 script[type="text/plain"]，載入時才寫入 iframe。
     原始碼裡的結束 script 標籤與 HTML 註解開頭，為了能放進 script 標籤而被轉義，這裡還原。 */
  var HELPER = '<style>html,body{min-height:0!important;height:auto!important}</style>' +
    '<script>(function(){var id="__ID__",last=0;' +
    'function post(){var h=Math.ceil(document.documentElement.getBoundingClientRect().height);' +
    'if(Math.abs(h-last)>1){last=h;parent.postMessage({demoFrame:id,h:h},"*");}}' +
    'new ResizeObserver(post).observe(document.documentElement);addEventListener("load",post);' +
    'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");' +
    'if(!a)return;e.preventDefault();var k=a.getAttribute("href").slice(1);' +
    'var t=k&&document.getElementById(decodeURIComponent(k));if(t)t.scrollIntoView();});})();<\/script>';
  var frames = document.querySelectorAll('iframe.frame');
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.demoFrame) return;
    var f = document.getElementById(d.demoFrame);
    if (f && !f.classList.contains('fixed')) f.style.height = Math.min(d.h, 30000) + 'px';
  });
  frames.forEach(function (f) {
    var src = document.getElementById(f.dataset.src).textContent
      .replace(/<\\\/script/g, '<' + '/script').replace(/<\\!--/g, '<' + '!--');
    f.srcdoc = src + HELPER.replace('__ID__', f.id);
  });
})();
</script>
</body>
</html>
