<script>
  /* 把每個範例的原始碼放進右邊的程式碼框（在 ui-table.js 改寫 DOM 之前擷取） */
  (function () {
    var HL = new RegExp('(' + [
      /* 第 1 次增修 */
      'carousel-interval="0"', 'progress-bar-color1', 'progress-bar-color2', 'extra-info-size', 'extra-info-color',
      'carouselInterval: 0', 'progressBarColor1', 'progressBarColor2', 'extraInfoSize', 'extraInfoColor',
      /* 第 2 次增修 */
      'tree-line-color', 'tree-accordion', 'tree-indent', 'tree-icon', 'tree-open', 'tree-line', 'tree-col',
      'treeLineColor', 'treeAccordion', 'treeIndent', 'treeIcon', 'treeOpen', 'treeLine', 'treeCol',
      'children', 'UiTable\\.expandAll', 'UiTable\\.collapseAll', 'uit-tree-toggle',
      /* 第 3 次增修 */
      'icons-list-interval', 'icons-list', 'iconsListInterval', 'iconsList'
    ].join('|') + ')', 'g');
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function dedent(s) {
      var lines = s.replace(/^\s*\n/, '').replace(/\s+$/, '').split('\n');
      var min = Infinity;
      lines.forEach(function (l) {
        if (!l.trim()) return;
        var m = l.match(/^ */)[0].length;
        if (m < min) min = m;
      });
      return lines.map(function (l) { return l.slice(min === Infinity ? 0 : min); }).join('\n');
    }
    document.querySelectorAll('.demo-case').forEach(function (sec) {
      var src = sec.querySelector('.demo-src');
      var out = sec.querySelector('.demo-code');
      if (!src || !out) return;
      var raw = dedent(src.innerHTML).replace(/=""/g, '');
      out.innerHTML = esc(raw).replace(HL, '<span class="hl">$1</span>');
    });
  })();

  /* 把元件的 console 警告與錯誤改用 Bootstrap alert 顯示 */
  (function () {
    /* icons-list 的訊息放在第 13 節，其他的放在第 4 節 */
    function push(kind, args) {
      var text = Array.prototype.map.call(args, String).join(' ');
      if (text.indexOf('[ui-table]') !== 0) return;
      var box = document.getElementById(text.indexOf('icons-list') > -1 ? 'uit-log-3' : 'uit-log');
      var el = document.createElement('div');
      el.className = 'alert alert-dismissible fade show' + (kind === 'error' ? ' is-err' : '');
      el.setAttribute('role', 'alert');
      var b = document.createElement('b');
      b.textContent = kind === 'error' ? '錯誤　' : '警告　';
      el.appendChild(b);
      el.appendChild(document.createTextNode(text.replace('[ui-table] ', '')));
      var close = document.createElement('button');
      close.type = 'button';
      close.className = 'btn-close';
      close.setAttribute('data-bs-dismiss', 'alert');
      el.appendChild(close);
      box.appendChild(el);
    }
    ['warn', 'error'].forEach(function (k) {
      var orig = console[k].bind(console);
      console[k] = function () { orig.apply(null, arguments); push(k, arguments); };
    });
  })();
</script>

  <section class="demo-sec">
    <h2>修改 1：屬性與 API</h2>
    <table class="ref">
      <thead><tr><th>名稱</th><th>寫在哪裡</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td>can-hide</td><td>ui-row-enhance</td><td>空值或 <code class="inl">true</code>：眼睛放在最後一欄。數字（1 起算）：放在指定欄，超過欄數時改放最後一欄。<code class="inl">false</code>：關閉。寫在 ui-row 上會被忽略並出現警告。</td></tr>
        <tr><td>can-hide-size</td><td>ui-row-enhance</td><td>眼睛大小。純數字視為 px，也接受 px、rem、em。沒寫時跟隨文字大小。</td></tr>
        <tr><td>can-hide-color</td><td>ui-row-enhance</td><td>眼睛顏色，可用色票名稱（例如 pink）或色碼。沒寫時跟隨格子文字色，inverse 格子自動改成深色。</td></tr>
        <tr><td>與 extra-info 互斥</td><td>眼睛所在的格子</td><td>該格的 extra-info 被忽略，主控台警告；同一列其他格子的 extra-info 照常運作。</td></tr>
        <tr><td>uit-row-hide 事件</td><td>原本的 &lt;ui-table&gt;</td><td>整列隱藏動畫結束後觸發，<code class="inl">e.detail.rowEl</code> 是被隱藏的列，<code class="inl">e.detail.hasChildren</code> 表示是否連同子列一起隱藏。</td></tr>
        <tr><td>UiTable.showHidden(target)</td><td>JavaScript</td><td>把眼睛隱藏的列全部顯示回來，回傳恢復的列數。target 可以是 &lt;ui-table&gt; 元素、CSS 選擇器，省略則作用於頁面上全部的表格。錄影重拍時使用。</td></tr>
      </tbody>
    </table>
    <p class="note">隱藏只影響畫面，重新整理頁面就會恢復。眼睛和 show-next 是各自獨立的：被眼睛隱藏的列，不會因為上一列的 show-next 被點擊而重新出現。</p>
  </section>

<div class="page">
  <h1>ui-table：toggle 按鈕與滑過顯示</h1>
  <p class="lead-note">修改日期 11-06-26。格子新增兩項功能：<code>toggle</code> 在格子右側放一顆可自訂圖示的按鈕，按下後在這一列下方展開附屬內容；<code>hover-source</code> 搭配 <code>hover-target</code>，滑鼠移到格子上就把內容放進指定區塊。</p>

  <section class="demo">
    <h2>屬性一覽</h2>
    <table class="attr-table">
      <thead><tr><th>屬性</th><th>寫在哪裡</th><th>值</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td><code>toggle</code></td><td><code>&lt;ui-col&gt;</code></td><td>元素 id</td><td>展開內容的來源，建議用 <code>&lt;template&gt;</code>。</td></tr>
        <tr><td><code>toggle-icon</code></td><td>兩者皆可</td><td>Bootstrap Icons 名稱</td><td>收合時的圖示，預設 <code>bi-chevron-down</code>，<code>bi-</code> 可省略。</td></tr>
        <tr><td><code>toggle-icon-open</code></td><td>兩者皆可</td><td>Bootstrap Icons 名稱</td><td>展開時的圖示，預設 <code>bi-chevron-up</code>。</td></tr>
        <tr><td><code>toggle-color</code></td><td>兩者皆可</td><td>色名或色碼</td><td>按鈕與展開區虛線的顏色，預設為主題色。</td></tr>
        <tr><td><code>hover-source</code></td><td><code>&lt;ui-col&gt;</code></td><td>元素 id</td><td>滑鼠移入時要顯示的內容。</td></tr>
        <tr><td><code>hover-target</code></td><td>兩者皆可</td><td>元素 id</td><td>內容放置的位置。寫在 <code>&lt;ui-table&gt;</code> 是整張表的預設。</td></tr>
      </tbody>
    </table>
  </section>

  <section class="demo">
    <h2>範例 1：自訂圖示的 toggle</h2>
    <p class="desc">整張表用 <code>toggle-icon="plus-circle"</code> 與 <code>toggle-icon-open="dash-circle"</code>。按右欄的按鈕，在這一列下方展開例句，再按一次收起。</p>
    <div class="pair">

    </div>

  <section class="demo">

    <p class="desc">同一列的兩個按鈕共用一個展開區，按另一個會直接換內容。右格有遮罩，揭曉後才看得到按鈕。點左格本身會用 <code>show-next</code> 顯示下一列，按左格的按鈕則只展開內容。</p>

  function showAlert(msg) {

    a.className = 'alert alert-info'; a.setAttribute('role', 'alert'); a.textContent = msg;

    setTimeout(function () { a.remove(); }, 2200);

<script>
(function () {
  var MARK = '<!-- ===== body ===== -->';
  var frame = document.getElementById('stage');
  var parts = Array.prototype.slice.call(document.querySelectorAll('template[data-part]'));
  var btns = Array.prototype.slice.call(document.querySelectorAll('[data-go]'));

  function show(id, push) {
    var t = document.getElementById(id) || parts[0];
    var src = t.innerHTML;
    var i = src.indexOf(MARK);
    var head = i >= 0 ? src.slice(0, i) : '';
    var body = i >= 0 ? src.slice(i + MARK.length) : src;
    /* srcdoc 的相對路徑以本頁為準，所以元件的 js 照原樣載入 */
    frame.srcdoc = '<!doctype html><html ' + (t.dataset.htmlAttrs || '') + '><head>' + head +
      '</head><body>' + body + '</body></html>';
    document.getElementById('now').textContent = t.dataset.component + '　' + t.dataset.date + '　' + t.dataset.title;
    document.getElementById('from').textContent = '原檔 ' + t.dataset.from;
    btns.forEach(function (b) { b.classList.toggle('on', b.dataset.go === t.id); });
    if (push && location.hash !== '#' + t.id) history.replaceState(null, '', '#' + t.id);
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.go, true); });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1) || parts[parts.length - 1].id, false);
})();
</script>
