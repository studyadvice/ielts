<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<title>Nelson</title>
<style>
  .page-wrap{max-width:1080px;margin:0 auto;padding:24px 28px 80px;}
  h1{font-size:1.5rem;color:#C6C7BD;margin-bottom:4px;}
  .subtitle{font-size:0.95rem;color:#9a9b94;margin-bottom:20px;}
  .section-title{font-size:1rem;color:#82C8E5;margin:28px 0 10px;border-left:4px solid #1CCAE8;padding-left:10px;}
  .paste-area{width:100%;box-sizing:border-box;}
  textarea{width:100%;box-sizing:border-box;background:#0f100e;color:#C6C7BD;border:1px solid #3a3b37;
    border-radius:8px;padding:12px;font-size:0.95rem;line-height:1.5;font-family:monospace;resize:vertical;}
  .paste-btns{display:flex;gap:10px;margin-top:10px;}
  .paste-btns button{font-size:0.95rem;padding:8px 16px;border-radius:6px;border:1px solid #3a3b37;
    background:#202119;color:#C6C7BD;cursor:pointer;}
  .paste-btns button:hover{border-color:#1CCAE8;color:#1CCAE8;}
  #blocks-root{margin-top:20px;}
  .changelog{margin-top:60px;padding-top:20px;border-top:1px solid #26271f;font-size:0.85rem;color:#7d7e78;}
  .changelog h2{font-size:0.95rem;color:#9a9b94;}
  code{background:#17181a;padding:1px 6px;border-radius:4px;color:#DBEDD8;}

  #setup-panel{transition:none;}
  #setup-panel.collapsed{display:none;}
  .setup-reopen{display:none;align-items:center;gap:10px;padding:8px 14px;margin-bottom:14px;
    background:#15241f;border-left:4px solid #0DA591;border-radius:4px;cursor:pointer;
    font-size:0.9rem;color:#9a9b94;user-select:none;}
  .setup-reopen.show{display:flex;}
  .setup-reopen:hover{color:#82C8E5;}
</style>
</head>
<body>
<div class="page-wrap">

  <div id="setup-reopen" class="setup-reopen"><span>▸</span><span>展開設定（匯入 / 貼上文字 / 筆跡設定）</span></div>

  <div id="setup-panel">
    <h1>觸控筆克漏字書寫</h1>

    <!-- 匯入元件 -->
    <ui-import></ui-import>

    <!-- 筆跡設定 -->
    <div class="pen-settings">
      <label>筆跡顏色：
        <select id="pen-color-select"></select>
      </label>
      <label>筆跡粗細（px）：
        <input type="number" id="pen-width-input" min="1" max="20" value="4" />
      </label>
    </div>

    <!-- 額外加值：直接貼上文字（非必要，方便錄影前臨時修改範例） -->
    <div class="section-title">貼上文字（選用，取代檔案匯入）</div>
    <div class="paste-area">
      <textarea id="paste-input" rows="25" placeholder="[ZH]&#10;中文對照句&#10;[EN]&#10;English sentence with [bracketed] words to blank out.&#10;&#10;[ZH]&#10;第二句...&#10;[EN]&#10;Second [sentence] here."></textarea>
      <div class="paste-btns">
        <button type="button" id="paste-apply">套用（視為 .txt 格式，套用後自動收合）</button>
        <button type="button" id="paste-clear">清空</button>
      </div>
    </div>
  </div>

  <hr>
  <div id="blocks-root"></div>

  <!-- Modal（全頁僅一個） -->
  <ui-handwrite-modal></ui-handwrite-modal>


</div>

<script src="cloze-handwrite.js"></script>
<script>
  (function () {
    var root = document.getElementById('blocks-root');
    var modal = document.querySelector('ui-handwrite-modal');

    function render(pairs) {
      root.innerHTML = '';
      pairs.forEach(function (p) {
        var block = document.createElement('ui-bilingual-block');
        root.appendChild(block);
        block.data = p;
      });
    }

    // 預設範例資料
    var sampleText =
      '[ZH]\n' +
      '這種句型容易讓你把注意力放在別人身上，而不是自己的內在經歷。\n' +
      '[EN]\n' +
      'This kind of sentence structure can shift your [focus] onto others instead of your own [personal] experience.\n\n' +
      '[ZH]\n' +
      '雅思口說第二部分的核心是展現你對個人經驗的深度理解。\n' +
      '[EN]\n' +
      'The core of IELTS Speaking Part 2 is to show a deep [understanding] of your own personal [experience].';

    render(window.ClozeHandwrite.parseTxt(sampleText));

    // 設定區收合 / 展開
    var setupPanel = document.getElementById('setup-panel');
    var setupReopen = document.getElementById('setup-reopen');
    function collapseSetup() {
      setupPanel.classList.add('collapsed');
      setupReopen.classList.add('show');
    }
    function expandSetup() {
      setupPanel.classList.remove('collapsed');
      setupReopen.classList.remove('show');
    }
    setupReopen.addEventListener('click', expandSetup);

    // 匯入元件事件
    document.querySelector('ui-import').addEventListener('data-parsed', function (e) {
      render(e.detail);
      window.ClozeHandwrite.showAlert('已匯入 ' + e.detail.length + ' 組題目。', 'info');
      collapseSetup();
    });

    // 貼上文字區（選用）
    document.getElementById('paste-input').value = sampleText;
    document.getElementById('paste-apply').addEventListener('click', function () {
      var raw = document.getElementById('paste-input').value;
      try {
        var pairs = window.ClozeHandwrite.parseTxt(raw);
        if (!pairs.length) {
          window.ClozeHandwrite.showAlert('沒有解析到任何題組，請確認格式。');
          return;
        }
        render(pairs);
        window.ClozeHandwrite.showAlert('已套用貼上的內容。', 'info');
        collapseSetup();
      } catch (err) {
        window.ClozeHandwrite.showAlert('解析失敗：' + err.message);
      }
    });
    document.getElementById('paste-clear').addEventListener('click', function () {
      document.getElementById('paste-input').value = '';
    });

    // 筆跡設定
    var colorSelect = document.getElementById('pen-color-select');
    window.ClozeHandwrite.penColorOptions.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt[0];
      o.textContent = opt[1];
      colorSelect.appendChild(o);
    });
    colorSelect.value = 'focus';
    modal.setPenColor('focus');
    colorSelect.addEventListener('change', function () {
      modal.setPenColor(colorSelect.value);
    });

    var widthInput = document.getElementById('pen-width-input');
    modal.setPenWidth(widthInput.value);
    widthInput.addEventListener('change', function () {
      modal.setPenWidth(widthInput.value);
    });
  })();
</script>
</body>
</html>
