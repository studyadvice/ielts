<div class="page">

<h1>&lt;ui-detail-ladder&gt; 細節階梯元件</h1>
<p class="lead-text">把籠統說法逐階升級成具體說法。左側為階梯軌道，右側依序為 pill、次標題、本文、註腳、進度條與按鈕，全部可由屬性自訂。</p>
<div class="alert alert-dark-custom" style="margin:12px 0 0 0;border-color:#B484E8">
  <i class="bi bi-clock-history" style="color:#B484E8"></i>
  版本紀錄：v1.0 首版（範例一到三）；v1.1 新增預設收合、鍵盤切換、次標題圖示（見頁面下方「v1.1 更新」）。
</div>

<!-- ========== 範例一 ========== -->
<h2>範例一：全部使用預設值</h2>
<div class="demo-row">
  <div>
    <ui-detail-ladder id="demo1">
      <ladder-step label="籠統說法">
        <step-title>原本的說法</step-title>
        <step-body>I live <mark>near</mark> my school.</step-body>
        <step-note>我住在學校附近。</step-note>
      </ladder-step>
      <ladder-step label="加上距離感">
        <step-title>先讓距離可以想像</step-title>
        <step-body>I live <mark>within walking distance of</mark> my school.</step-body>
        <step-note>我住的地方走路就能到學校。</step-note>
      </ladder-step>
      <ladder-step label="加上數字">
        <step-title>換成可衡量的數字</step-title>
        <step-body>It's <mark>about a ten-minute walk</mark> from my place to school.</step-body>
        <step-note>從我家走到學校大約十分鐘。</step-note>
      </ladder-step>
      <ladder-step label="加上生活畫面">
        <step-title>最後補上一個生活場景</step-title>
        <step-body>It's a ten-minute walk, <mark>so I can roll out of bed at 7:45 and still make my first class</mark>.</step-body>
        <step-note>走路十分鐘，所以我七點四十五分才起床也趕得上第一堂課。</step-note>
      </ladder-step>
    </ui-detail-ladder>
    <div class="alert alert-dark-custom" id="log1">事件紀錄：點擊階梯或按鈕後顯示於此。</div>
  </div>
<pre>&lt;ui-detail-ladder&gt;
  &lt;ladder-step label="籠統說法"&gt;
    &lt;step-title&gt;原本的說法&lt;/step-title&gt;
    &lt;step-body&gt;I live &lt;mark&gt;near&lt;/mark&gt; my school.&lt;/step-body&gt;
    &lt;step-note&gt;我住在學校附近。&lt;/step-note&gt;
  &lt;/ladder-step&gt;
  &lt;ladder-step label="加上距離感"&gt;
    ...
  &lt;/ladder-step&gt;
&lt;/ui-detail-ladder&gt;

&lt;script src="ui-detail-ladder.js"&gt;&lt;/script&gt;</pre>
</div>

    direction="down"

    progress-text-color="#5DBAE8"
    next-text="下一階"
    pill-bg="#B6FF00">
    <ladder-step label="籠統說法">
      <step-title>原本的說法</step-title>
      <step-body>The bus was <mark>so crowded</mark>.</step-body>
      <step-note>公車很擠。</step-note>
    </ladder-step>
    <ladder-step label="換成結果">
      <step-title>用結果代替形容詞</step-title>
      <step-body>The buses were so packed that <mark>I couldn't get on</mark>.</step-body>
      <step-note>公車擠到我上不去。</step-note>
    </ladder-step>
    <ladder-step label="加上數字">
      <step-title>讓結果可以被衡量</step-title>
      <step-body>The buses were so packed that <mark>I let three go by</mark>.</step-body>
      <step-note>公車擠到我讓了三班過去。</step-note>
    </ladder-step>
  </ui-detail-ladder>
<pre>&lt;ui-detail-ladder
  direction="down"

<!-- ========== v1.1 更新 ========== -->
<h2 style="color:#71CD76;border-bottom-color:#71CD76">v1.1 更新：預設收合、鍵盤切換、次標題圖示</h2>
<p class="lead-text">以下每組左邊是 v1.1 實際效果，右邊是 v1.0 與 v1.1 的寫法對照。</p>

<h3>1. ini-collapse 預設收合</h3>
<div class="demo-row">
  <ui-detail-ladder id="demo4" ini-collapse ini-title="預設收合，點擊展開" border="true" border-color="#778CE1" padding="12px 16px">
    <ladder-step label="籠統說法">
      <step-title icon="bi-chat-square-quote">原本的說法</step-title>
      <step-body>Exercise is <mark>crucial</mark> for me.</step-body>
      <step-note>運動對我很重要。</step-note>
    </ladder-step>
    <ladder-step label="加上頻率">
      <step-title icon="bi-calendar-week">說出多常做</step-title>
      <step-body>I <mark>go for a run three times a week</mark>.</step-body>
      <step-note>我一週跑步三次。</step-note>
    </ladder-step>
    <ladder-step label="加上畫面">
      <step-title icon="bi-sunrise">放進一個具體時刻</step-title>
      <step-body>I go for a run three times a week, <mark>usually along the riverbank before work</mark>.</step-body>
      <step-note>我一週跑三次，通常是上班前沿著河堤跑。</step-note>
    </ladder-step>
  </ui-detail-ladder>
<pre><span style="color:#B6FF00">/* v1.0：沒有收合功能，元件一律展開 */</span>
&lt;ui-detail-ladder border="true"&gt;
  ...
&lt;/ui-detail-ladder&gt;

<span style="color:#71CD76">/* v1.1：加上 ini-collapse 即預設收合 */</span>
&lt;ui-detail-ladder ini-collapse
  ini-title="預設收合，點擊展開"
  border="true"&gt;
  ...
&lt;/ui-detail-ladder&gt;

ini-collapse 不必給值；寫成 ini-collapse="false" 等同不收合。
可搭配 ini-title-size、ini-title-color、ini-title-bg 調整標題列。</pre>
</div>

<h3>2. Ctrl+Shift+上下方向鍵切換階梯</h3>
<div class="demo-row">
  <div>
    <ui-detail-ladder id="demo5" direction="down" line-style="dotted" line-width="3px">
      <ladder-step label="籠統說法">
        <step-title icon="bi-geo-alt">原本的說法</step-title>
        <step-body>My location is <mark>convenient</mark>.</step-body>
        <step-note>我住的地方很方便。</step-note>
      </ladder-step>
      <ladder-step label="說出方便在哪">
        <step-title icon="bi-shop">指出具體設施</step-title>
        <step-body>There's <mark>a supermarket and a metro station</mark> right around the corner.</step-body>
        <step-note>轉角就有超市和捷運站。</step-note>
      </ladder-step>
      <ladder-step label="加上生活畫面">
        <step-title icon="bi-basket">描述一次真實使用</step-title>
        <step-body>If I run out of milk, <mark>I can grab some in my slippers</mark> and be back in five minutes.</step-body>
        <step-note>牛奶喝完了，我穿著拖鞋就能去買，五分鐘回到家。</step-note>
      </ladder-step>
    </ui-detail-ladder>
    <div class="alert alert-dark-custom" id="log5">
      <i class="bi bi-keyboard"></i> 把游標移到元件上（或點一下元件），再按 Ctrl+Shift+↑ 或 Ctrl+Shift+↓。
    </div>
  </div>
<pre><span style="color:#B6FF00">/* v1.0：只能用滑鼠點階梯或按鈕 */</span>

<span style="color:#71CD76">/* v1.1：預設啟用鍵盤，不需任何設定 */</span>
&lt;ui-detail-ladder direction="down"&gt;
  ...
&lt;/ui-detail-ladder&gt;

/* 若要關閉 */
&lt;ui-detail-ladder keyboard="false"&gt;

規則：
・方向鍵依「畫面上的上下」移動。
  direction="up"   時 ↑ 是下一階。
  direction="down" 時 ↓ 是下一階。
・作用對象：最近一次被游標指到、點擊
  或用 Tab 取得焦點的那一個元件。
・游標在其他 input、textarea 打字時不攔截。
・收合狀態下不作用。
・用鍵盤切換時，目前階梯的圓點外圍會加一圈提示框。</pre>
</div>

<h3>3. step-title 的 icon 屬性</h3>
<div class="demo-row">
  <ui-detail-ladder id="demo6" title-icon-color="#FF91D7" show-progress="false">
    <ladder-step label="籠統說法">
      <step-title icon="bi-emoji-neutral">原本的說法</step-title>

    </ladder-step>
    <ladder-step label="加上感官">
      <step-title icon="bi bi-fire" icon-color="#B6FF00">完整寫法也可以（bi bi-fire）</step-title>
      <step-body>There's a night market two streets away, <mark>and you can smell the grilled squid from my balcony</mark>.</step-body>
    </ladder-step>
  </ui-detail-ladder>
<pre><span style="color:#B6FF00">/* v1.0：圖示要自己寫在標題裡 */</span>
&lt;step-title&gt;&lt;i class="bi bi-star-fill"&gt;&lt;/i&gt; 標題&lt;/step-title&gt;

&lt;step-title icon="bi-star-fill"&gt;標題&lt;/step-title&gt;

/* 三種寫法都可以 */
icon="bi-star-fill"
icon="star-fill"
icon="bi bi-star-fill"

/* 單一圖示改色 */
&lt;step-title icon="bi-fire" icon-color="#B6FF00"&gt;

/* 整個元件的圖示統一改色（預設 #E3D322） */
&lt;ui-detail-ladder title-icon-color="#FF91D7"&gt;</pre>
</div>

<!-- ========== 結構說明 ========== -->
<h2>內容結構</h2>
<table class="ref">
  <tr><th style="width:220px">標籤</th><th style="width:160px">屬性</th><th>說明</th></tr>
  <tr><td>&lt;ladder-step&gt;</td><td>label</td><td>左側階梯文字，同時顯示在 pill 冒號後方。</td></tr>
  <tr><td>&lt;ladder-step&gt;</td><td>pill</td><td>pill 前段文字。未設定時第一階為「起點」，其後為「第1階」、「第2階」依序遞增。</td></tr>

<div class="page">

<h1>&lt;ui-detail-ladder&gt; v1.2：顏色屬性支援品牌色名稱</h1>
<div class="alert alert-dark-custom">
  <i class="bi bi-bug" style="color:#EF6661"></i>
  問題：v1.1 的顏色屬性只認 <code>#hex</code> 或 CSS 原生色名。填 <code>key</code>、<code>base</code>、<code>vanilla</code>、<code>energetic</code> 這類品牌色名稱時，瀏覽器視為無效值，該部位直接變成黑色或透明；填 <code>pink</code>、<code>blue</code> 這類和 CSS 撞名的名稱，則會顯示 CSS 原生的粉紅與純藍，而非品牌色。v1.2 起所有顏色屬性都先轉換品牌色名稱，與 <code>ui-insight</code> 的寫法一致。
</div>

<h2>同一段設定在 v1.1 與 v1.2 的差異</h2>
<div class="cmp">
  <div>
    <h3 class="tag-old"><i class="bi bi-x-circle"></i> v1.1（修正前的現象）</h3>
    <ul style="font-size:.9rem;line-height:1.8;margin:0;padding:0 0 0 20px">
      <li><code>bg="base"</code>：背景變透明。</li>
      <li><code>title-color="key"</code>、<code>body-color="vanilla"</code>：文字變黑色，在深色底上幾乎看不見。</li>
      <li><code>pill-bg="energetic"</code>：膠囊標籤沒有底色。</li>
      <li><code>current-color="pink"</code>：顯示 CSS 原生粉紅 #FFC0CB，不是品牌 pink。</li>
      <li><code>icon-color="yellow"</code>：顯示 CSS 原生純黃 #FFFF00。</li>
    </ul>
  </div>
  <div>
    <h3 class="tag-new"><i class="bi bi-check-circle"></i> v1.2（修正後，實際元件）</h3>
    <ui-detail-ladder bg="base" title-color="key" body-color="vanilla" pill-bg="energetic"
      current-color="pink" active-color="Blue" line-active-color="blue" hl-bg="yellow"
      progress-color="green" progress-color-end="KEY" border="true" border-color="indigo">
      <ladder-step label="籠統說法">
        <step-title icon="chat-square-quote" icon-color="yellow">原本的說法</step-title>
        <step-body>The bus was <mark>so crowded</mark>.</step-body>
        <step-note>公車很擠。</step-note>
      </ladder-step>
      <ladder-step label="換成結果">
        <step-title icon="bi-arrow-right-circle" icon-color="playful">用結果代替形容詞</step-title>
        <step-body>The buses were so packed that <mark>I couldn't get on</mark>.</step-body>
        <step-note>公車擠到我上不去。</step-note>
      </ladder-step>
      <ladder-step label="加上數字">
        <step-title icon="bi bi-123" icon-color="dreamy">讓結果可以被衡量</step-title>
        <step-body>The buses were so packed that <mark>I let three go by</mark>.</step-body>
        <step-note>公車擠到我讓了三班過去。</step-note>
      </ladder-step>
    </ui-detail-ladder>

<!-- ===== body ===== -->
<div class="page">

<h1>&lt;ui-insight&gt; 亮點字詞解說元件</h1>
<p class="lead-text">左側為一句一句的卡片，右側顯示所選句子中亮點字詞的解說。滑過句中亮點或右側解說可互相對照，所有部位的配色、字體與間距都可由屬性自訂。</p>

<!-- ========== 範例一 ========== -->
<h2>範例一：全部使用預設值</h2>
<div class="demo-row">
  <div>
    <ui-insight id="demo1">
      <ins-line>
        <hl why="自然的開場語氣，取代 That's an interesting question 這類罐頭開場。">Honestly,</hl> I'm
        <hl why="慣用說法，比 I don't like getting up early 更道地，也不必用大字。" tag="lr">not much of a morning person</hl>,
        so I usually run after work instead.
      </ins-line>
      <ins-line>
        <hl why="混合條件句：過去沒發生的事，連到現在的結果。" tag="gra">If I hadn't moved closer to the office</hl>,
        I'd probably still be <hl why="stuck 帶出被困住的無奈感，比 spend time on the bus 生動。">stuck on the bus</hl> for an hour.
      </ins-line>
      <ins-line>
        The buses were so packed that <hl why="用具體結果取代 very crowded，數字讓畫面立刻出現。">I let three go by</hl>.
      </ins-line>
      <ins-line>
        I live near my school.
      </ins-line>
    </ui-insight>
    <div class="alert alert-dark-custom" id="log1">事件紀錄：點選句子卡片後顯示於此。</div>
  </div>
<pre>&lt;ui-insight&gt;
  &lt;ins-line&gt;
    &lt;hl why="自然的開場語氣"&gt;Honestly,&lt;/hl&gt; I'm
    &lt;hl why="慣用說法" tag="lr"&gt;not much of a morning person&lt;/hl&gt;,
    so I usually run after work instead.
  &lt;/ins-line&gt;
  &lt;ins-line&gt;
    ...
  &lt;/ins-line&gt;
&lt;/ui-insight&gt;

&lt;script src="ui-insight.js"&gt;&lt;/script&gt;

<span class="cm">右側解說的字詞會自動取自亮點文字，
並去掉結尾的逗號與句號（Honestly, 會顯示成 Honestly）。
沒有任何 &lt;hl&gt; 的句子，右側會顯示 empty-text。</span></pre>
</div>

<!-- ========== 範例二 ========== -->
<h2>範例二：預設收合、外框、自訂配色、卡片標題、自訂標籤</h2>
<div class="demo-row">
  <ui-insight
    ini-collapse
    ini-title="Part 3 範例：城市生活的優缺點"
    border="true"
    border-color="#778CE1"
    padding="14px 18px"
    split="50%"
    card-active-border="#FF91D7"
    num-active-bg="#FF91D7"
    hl-line-color="#5DBAE8"
    hl-line-style="dotted"
    hl-hot-bg="#5DBAE8"
    sup-color="#5DBAE8"
    note-num-bg="#5DBAE8"
    note-word-color="#5DBAE8"
    note-divider-style="solid"
    sentence-font-size="1.05rem"
    summary-text="Q{n} / {total}：{count} 個值得借用的說法">
    <ins-line heading="Is city life better for young people?">
      <hl why="先給立場再補一句保留，回答立刻有層次。" tag="fc">For the most part, yes</hl>,
      <hl why="but not for everyone 這種收尾讓論點不會太絕對。">though not for everyone</hl>.
    </ins-line>
    <ins-line heading="What are the downsides?">
      Rent eats up <hl why="用比例取代 expensive，具體又好懂。" tag="lr">almost half of a starting salary</hl>,
      so a lot of my friends <hl why="生活化的動詞片語，表示和別人合租。" tag="搭配詞" tag-color="#B6FF00">end up sharing a flat</hl>.
    </ins-line>
    <ins-line heading="Will this change in the future?">
      <hl why="未來進行式表達「照現況發展下去」的推測。" tag="gra">If remote work keeps growing</hl>,
      <hl why="hedging 用語，避免把預測說死。">I wouldn't be surprised if</hl> more people moved back to their hometowns.
    </ins-line>
  </ui-insight>
<pre>&lt;ui-insight
  ini-collapse
  ini-title="Part 3 範例：城市生活的優缺點"
  border="true" border-color="#778CE1"
  padding="14px 18px"

  &lt;ins-line heading="What are the downsides?"&gt;
    ...
    &lt;hl why="生活化的動詞片語"
        tag="搭配詞" tag-color="#B6FF00"&gt;end up sharing a flat&lt;/hl&gt;
  &lt;/ins-line&gt;
&lt;/ui-insight&gt;

<span class="cm">heading：卡片上方的小標題，適合放考官提問。
tag 填 lr、gra、fc、p 會變成內建標籤；
填其他文字則直接顯示該文字，可用 tag-color 指定顏色。</span></pre>

<!-- ========== 範例三 ========== -->
<h2>範例三：隱藏編號、色彩標籤、鍵盤切換、從第 2 句開始</h2>
<div class="demo-row">
  <div>
    <ui-insight
      id="demo3"
      show-num="false"
      show-sup="false"
      start="2"
      card-bg="#0C0D0C"
      card-border="#2A2B29"
      panel-bg="#0C0D0C"

      note-word-color="#E3D322"

      hl-line-color="#E3D322"
      hl-hot-bg="#E3D322"
      summary-text="{count} 個亮點">
      <ins-line>
        I'm <c-red>fond of cooking</c-red>.
      </ins-line>
      <ins-line>
        I don't mind <hl why="don't mind 比 like 低調，聽起來更真實。<c-blue>小提醒</c-blue>：後面接動名詞。">cooking dinner for my family</hl>,
        <hl why="把動作放進具體情境，可以搭配 <c-pink>back-to-back meetings</c-pink>。" tag="lr">even after a hectic day</hl>.
      </ins-line>
      <ins-line>
        <hl why="用時間點取代 sometimes，頻率立刻清楚。">On Sunday evenings</hl>, I make a big pot of soup that lasts us till Wednesday.
      </ins-line>
    </ui-insight>
    <div class="alert alert-dark-custom" id="log3">
      <i class="bi bi-keyboard"></i> 把游標移到元件上（或點一下元件），再按 Ctrl+Shift+↑ 或 Ctrl+Shift+↓ 切換句子。
    </div>
  </div>
<pre>&lt;ui-insight
  show-num="false"
  show-sup="false"
  start="2"
  card-bg="#0C0D0C"
  panel-bg="#0C0D0C"
  note-word-color="#E3D322"
  hl-line-color="#E3D322"
  hl-hot-bg="#E3D322"
  summary-text="{count} 個亮點"&gt;
  &lt;ins-line&gt;
    I'm &lt;c4&gt;fond of cooking&lt;/c4&gt;.
  &lt;/ins-line&gt;
  &lt;ins-line&gt;
    I don't mind &lt;hl why="... &lt;c3&gt;小提醒&lt;/c3&gt;：後面接動名詞。"&gt;
      cooking dinner for my family&lt;/hl&gt;, ...
  &lt;/ins-line&gt;
&lt;/ui-insight&gt;

<span class="cm">句子內文與 why 解說都支援 &lt;c1&gt; 到 &lt;c16&gt; 色彩標籤。
鍵盤：Ctrl+Shift+↑ 上一句，Ctrl+Shift+↓ 下一句。
作用於最近一次被游標指到、點擊或用 Tab 取得焦點的元件。</span></pre>
</div>

<script>
(() => {
  const NAMES = {
    base:'#0C0D0C', shell:'#C6C7BD', violet:'#B484E8', blue:'#5DBAE8', red:'#EF6661', energetic:'#B6FF00',
    blue:'#5DBAE8', green:'#71CD76', green:'#71CD76', vanilla:'#DBEDD8', yellow:'#E3D322', vanilla:'#DBEDD8',
    green:'#71CD76', indigo:'#778CE1', indigo:'#778CE1', pink:'#FF91D7', dreamy:'#DE8EC9'
  };

  const sw = document.getElementById('swatches');
  Object.entries(NAMES).forEach(([n, hex]) => {
    const col = document.createElement('div');
    col.className = 'col-6 col-md-3 col-xl-2';
    col.innerHTML = `<span class="swatch" style="background:${hex}"></span><code>${n}</code> <span style="font-size:0.75rem">${hex}</span>`;
    sw.appendChild(col);
  });

  const selBg = document.getElementById('selBg');
  const selFg = document.getElementById('selFg');
  const live = document.getElementById('live');
  const code = document.getElementById('liveCode');
  const opts = Object.keys(NAMES).map((n) => `<option value="${n}">${n}</option>`).join('');
  selBg.innerHTML = opts;
  selFg.innerHTML = opts;
  selBg.value = 'pink';
  selFg.value = 'base';

  const showMsg = (html, type) => {
    const box = document.getElementById('msg');
    box.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${html}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>`;
  };

  const sync = (notify) => {
    live.setAttribute('hl-hot-bg', selBg.value);
    live.setAttribute('hl-hot-color', selFg.value);
    code.textContent = `hl-hot-bg="${selBg.value}" hl-hot-color="${selFg.value}"`;
    if (notify) {
      if (selBg.value === selFg.value) {
        showMsg('底色與文字色相同，亮點被指到時會看不見文字，請換一個顏色。', 'info');
      } else {
        showMsg(`已套用 hl-hot-bg=${selBg.value}（${NAMES[selBg.value]}），hl-hot-color=${selFg.value}（${NAMES[selFg.value]}）。`, 'success');
      }
    }
  };
  selBg.addEventListener('change', () => sync(true));
  selFg.addEventListener('change', () => sync(true));
  sync(false);

  /* ---- v1.2 theme 範例 ---- */
  const THEMES = customElements.get('ui-insight').themes;

  const selTheme = document.getElementById('selTheme');
  const selOver = document.getElementById('selOver');
  const themeLive = document.getElementById('themeLive');
  const themeCode = document.getElementById('themeCode');
  selTheme.innerHTML = THEMES.map((t) => `<option value="${t}">${t}</option>`).join('');
  selOver.innerHTML = '<option value="">（不覆蓋）</option>' +
    Object.keys(NAMES).map((n) => `<option value="${n}">${n}</option>`).join('');
  selTheme.value = 'violet';

  const syncTheme = (notify) => {
    themeLive.setAttribute('theme', selTheme.value);
    if (selOver.value) themeLive.setAttribute('hl-hot-bg', selOver.value);
    else themeLive.removeAttribute('hl-hot-bg');
    themeCode.textContent = `theme="${selTheme.value}"` + (selOver.value ? ` hl-hot-bg="${selOver.value}"` : '');
    if (notify) {
      showMsg(selOver.value
        ? `已套用 theme=${selTheme.value}，並以 hl-hot-bg=${selOver.value} 覆蓋亮點底色。`
        : `已套用 theme=${selTheme.value}，所有顏色都跟著主題。`, 'success');
    }
  };
  selTheme.addEventListener('change', () => syncTheme(true));
  selOver.addEventListener('change', () => syncTheme(true));
  syncTheme(false);

  const grid = document.getElementById('themeGrid');

<h1>&lt;ui-insight&gt; v1.3：extra-info</h1>
<p class="desc">在 &lt;ins-line&gt; 加上 extra-info="template 的 id"，選到這一句時，template 的內容會顯示在右側面板最下方。點左側卡片或按 Ctrl+Shift+上下方向鍵切換。</p>

<h2>範例一：每句附中文翻譯</h2>
<p class="desc">兩句各自指向不同的 template。</p>
<div class="demo-grid">

    <ins-line heading="Describe someone you met at a party and enjoyed talking with." extra-info="tpl-party-1">

    </ins-line>
    <ins-line extra-info="tpl-party-2">
      <hl tag="fc" why="第二句交代場合與時間">It was a friend's housewarming last spring</hl>, and the person sitting next to me on the balcony <hl tag="lr" why="揭曉對方身分，順勢銜接到聊天內容">turned out to be</hl> a wildlife photographer.
    </ins-line>
  </ui-insight>
<pre>&lt;ui-insight&gt;

  &lt;/ins-line&gt;
&lt;/ui-insight&gt;

&lt;template id="tpl-party-1"&gt;
  &lt;span class="zh-label"&gt;中文翻譯&lt;/span&gt;&lt;br&gt;

&lt;/template&gt;</pre>
</div>

<h2>範例二：搭配 theme、自訂外觀，只有部分句子有附加內容</h2>
<p class="desc">第二句沒有 extra-info，切換過去時附加區塊會自動隱藏。template 內可放任意 HTML，例如清單與圖示。</p>

<script>
(function () {
  var MARK = '<!-- ===== body ===== -->';
  var frame = document.getElementById('stage');
  var parts = Array.prototype.slice.call(document.querySelectorAll('template[data-part]'));
  var btns = Array.prototype.slice.call(document.querySelectorAll('[data-go]'));

  function show(id, push) {
    var t = document.getElementById(id) || parts[0];
    var src = t.innerHTML;
    var i = src.indexOf(MARK);
    var head = i >= 0 ? src.slice(0, i) : '';
    var body = i >= 0 ? src.slice(i + MARK.length) : src;
    /* srcdoc 的相對路徑以本頁為準，所以元件的 js 照原樣載入 */
    frame.srcdoc = '<!doctype html><html ' + (t.dataset.htmlAttrs || '') + '><head>' + head +
      '</head><body>' + body + '</body></html>';
    document.getElementById('now').textContent = t.dataset.component + '　' + t.dataset.date + '　' + t.dataset.title;
    document.getElementById('from').textContent = '原檔 ' + t.dataset.from;
    btns.forEach(function (b) { b.classList.toggle('on', b.dataset.go === t.id); });
    if (push && location.hash !== '#' + t.id) history.replaceState(null, '', '#' + t.id);
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.go, true); });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1) || parts[parts.length - 1].id, false);
})();
</script>
