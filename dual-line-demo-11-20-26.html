<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg:       #0C0D0C;
      --shell:    #C6C7BD;
      --violet: #B484E8;
      --green:  #71CD76;

      --green:     #71CD76;

    }

    body {
      background-color: var(--bg);
      color: var(--shell);

      font-size: 1.125rem;
      line-height: 1.5;
      margin: 0; padding: 0;
    }
    h1 { font-size: 2.4rem; color: var(--violet); letter-spacing: .02em; }
    h2 { font-size: 1.7rem; color: var(--blue); margin-top: 72px; margin-bottom: 0; }
    h3 { font-size: 1.25rem; color: var(--blue); margin-top: 28px; margin-bottom: 6px; }
    h4 { font-size: 1.05rem; color: var(--vanilla); margin-bottom: 6px; }

    .wrap { max-width: 1300px; margin: 0 auto; padding: 0 48px 100px; }

    /* Hero */
    .hero { text-align: center; padding: 64px 0 48px; }
    .hero-badge {
      display: inline-block;
      background: rgba(195,165,229,.13); color: var(--violet);
      border: 1px solid rgba(195,165,229,.42); border-radius: 4px;
      padding: 3px 14px; font-size: .9rem; margin-bottom: 18px; letter-spacing: .05em;
    }
    .hero p { color: rgba(198,199,189,.82); max-width: 720px; margin: 12px auto 0; }

    /* Palette */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px; margin-top: 24px;
    }
    .swatch { border-radius: 6px; overflow: hidden; border: 1px solid rgba(198,199,189,.14); }
    .swatch-color { height: 54px; }
    .swatch-color.transparent-check {
      background-image:
        linear-gradient(45deg, #555 25%, transparent 25%),
        linear-gradient(-45deg, #555 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #555 75%),
        linear-gradient(-45deg, transparent 75%, #555 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0;
      background-color: #888;
    }
    .swatch-info { padding: 6px 10px 8px; background: rgba(198,199,189,.07); }
    .swatch-name { display: block; font-size: .88rem; font-weight: 700; color: var(--shell); }
    .swatch-hex  { display: block; font-size: .78rem; color: rgba(198,199,189,.62); font-family: monospace; letter-spacing: .03em; }
    .chg { display: inline-block; font-size: .68rem; color: var(--energetic); background: rgba(237,161,9,.14); border-radius: 3px; padding: 1px 5px; margin-top: 2px; }

    /* Demo panel */
    .dp {
      background: rgba(198,199,189,.04);
      border: 1px solid rgba(198,199,189,.11);
      border-radius: 8px; padding: 22px 24px; margin-top: 14px;
    }
    .dlabel {
      font-size: .85rem; color: rgba(198,199,189,.52);
      font-family: 'Consolas', monospace; margin-bottom: 12px;
    }
    .dlabel span { color: var(--yellow); }

    /* VR row */
    .vr-row { display: flex; align-items: center; flex-wrap: wrap; padding: 12px 0; }
    .vr-text { font-size: 1rem; color: var(--shell); padding: 0 4px; }

    /* Content blocks (for spacer demo) */
    .cb { border-radius: 6px; padding: 14px 20px; text-align: center; font-weight: 600; font-size: 1rem; }
    .cb-a { background: rgba(130,200,229,.12); border: 1px solid rgba(130,200,229,.35); color: var(--blue); }
    .cb-b { background: rgba(39,174,96,.10);   border: 1px solid rgba(39,174,96,.32);  color: var(--green); }

    /* Code block */
    .cb-code {
      background: rgba(0,0,0,.45); border: 1px solid rgba(198,199,189,.1);
      border-radius: 6px; padding: 14px 18px;
      font-family: 'Consolas', 'Monaco', monospace; font-size: .875rem;
      color: var(--vanilla); margin-top: 10px; overflow-x: auto; white-space: pre; line-height: 1.5;
    }
    .cb-code .k  { color: var(--violet); }
    .cb-code .a  { color: var(--blue); }
    .cb-code .v  { color: var(--yellow); }
    .cb-code .c  { color: rgba(198,199,189,.42); }

    /* Arrow showcase */
    .arrow-row {
      display: flex; align-items: center; gap: 0;
      padding: 18px 0; border-bottom: 1px solid rgba(198,199,189,.07);
    }
    .arrow-row:last-child { border-bottom: none; }
    .arrow-tag {
      font-family: monospace; font-size: .875rem; color: var(--shell);
      min-width: 260px; flex-shrink: 0; padding-right: 20px;
    }
    .arrow-tag em { color: var(--yellow); font-style: normal; }
    .arrow-preview { flex: 1; }

    /* Standalone arrow demo */
    .sa-row {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 0; border-bottom: 1px solid rgba(198,199,189,.07);
    }
    .sa-row:last-child { border-bottom: none; }
    .sa-label { font-family: monospace; font-size: .85rem; color: rgba(198,199,189,.65); min-width: 320px; flex-shrink: 0; }
    .sa-label em { color: var(--yellow); font-style: normal; }

    /* extraclass */
    .bs-demo {
      background: rgba(65,113,191,.09); border: 1px solid rgba(65,113,191,.28);
      border-radius: 8px; padding: 20px 24px;
    }

    /* Configurator */
    .configurator {
      background: rgba(198,199,189,.04); border: 1px solid rgba(198,199,189,.15);
      border-radius: 10px; padding: 28px 32px;
    }
    .cfg-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 16px;
    }
    .cfg-field label {
      display: block; font-size: .875rem; color: rgba(198,199,189,.72);
      margin-bottom: 5px; font-family: monospace;
    }
    .cfg-field select, .cfg-field input[type="text"] {
      width: 100%; background: rgba(0,0,0,.4);
      border: 1px solid rgba(198,199,189,.22); border-radius: 4px;
      color: var(--shell); padding: 6px 10px; font-size: .95rem; font-family: monospace;
    }
    .cfg-field select:focus, .cfg-field input:focus { outline: none; border-color: var(--blue); }
    .cfg-field select option { background: #1a1b1a; }
    .btn-group-cfg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .cfg-btn {
      background: rgba(198,199,189,.08); border: 1px solid rgba(198,199,189,.2);
      border-radius: 4px; color: var(--shell); padding: 5px 14px;
      font-size: .875rem; cursor: pointer; font-family: monospace;
      transition: background .15s, border-color .15s;
    }
    .cfg-btn.active { background: rgba(130,200,229,.2); border-color: var(--blue); color: var(--blue); }
    .cfg-btn.act-arrow { background: rgba(195,165,229,.2); border-color: var(--violet); color: var(--violet); }
    .live-preview {
      background: rgba(0,0,0,.3); border: 1px solid rgba(198,199,189,.1);
      border-radius: 6px; padding: 36px 24px; margin-top: 20px;
    }
    .live-code {
      background: rgba(0,0,0,.45); border: 1px solid rgba(198,199,189,.1);
      border-radius: 6px; padding: 14px 18px;
      font-family: 'Consolas', monospace; font-size: .875rem;
      color: var(--vanilla); margin-top: 12px; white-space: pre; overflow-x: auto;
    }

    /* Misc */
    .muted { color: rgba(198,199,189,.58); font-size: 1rem; }
    .inline-tag {
      display: inline-block; background: rgba(195,165,229,.12); color: var(--violet);
      font-family: monospace; font-size: .9rem; padding: 1px 8px;
      border-radius: 4px; border: 1px solid rgba(195,165,229,.28);
    }
    .new-badge {
      display: inline-block; background: rgba(39,174,96,.15); color: var(--green);
      font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 10px;
      vertical-align: middle; margin-left: 8px; letter-spacing: .05em;
    }
    .shr { margin-top: 72px; }
    code { background: rgba(198,199,189,.1); color: var(--blue); padding: 1px 6px; border-radius: 3px; font-size: .9rem; }

    /* attr table */
    .attr-table { width: 100%; border-collapse: collapse; font-size: .92rem; font-family: monospace; }
    .attr-table th { padding: 8px 12px; color: var(--violet); text-align: left; font-weight: 700; border-bottom: 1px solid rgba(198,199,189,.18); }
    .attr-table td { padding: 8px 12px; color: var(--shell); border-bottom: 1px solid rgba(198,199,189,.08); }
    .attr-table td:first-child { color: var(--yellow); }
    .attr-table td:nth-child(3) { color: rgba(198,199,189,.58); }
  </style>
</head>

<div class="wrap">

  <\!-- Hero -->
  <div class="hero">
    <div class="hero-badge">dual-line.js · v2.1 · 2026-10-15</div>

      雙色分割線語意元件。v2.1 新增

    <div class="swatch"><div class="swatch-color" style="background:#E3D322"></div><div class="swatch-info"><span class="swatch-name">yellow</span><span class="swatch-hex">#E3D322</span></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#DE8EC9"></div><div class="swatch-info"><span class="swatch-name">dreamy</span><span class="swatch-hex">#DE8EC9</span></div></div>
    <div class="swatch"><div class="swatch-color" style="background:#5DBAE8"></div><div class="swatch-info"><span class="swatch-name">blue</span><span class="swatch-hex">#5DBAE8</span><span class="chg">修正</span></div></div>

  <\!-- ══ 箭頭 ══ -->
  <div class="shr">
    <h2><span class="inline-tag">arrow</span> 箭頭屬性 <span class="new-badge">NEW v2.1</span></h2>

<script>
  const liveHR   = document.getElementById('live-hr');
  const liveCode = document.getElementById('live-code');
  let curStyle = 'solid';
  let curArrow = '';

  function updateLive() {
    const cl    = document.getElementById('cfg-cl').value;
    const cr    = document.getElementById('cfg-cr').value;
    const ratio = document.getElementById('cfg-ratio').value.trim() || '5:5';
    const thick = document.getElementById('cfg-thick').value.trim() || '2px';
    const dash  = document.getElementById('cfg-dash').value.trim()  || '8px';
    const gap   = document.getElementById('cfg-gap').value.trim()   || '5px';
    const asize = document.getElementById('cfg-asize').value.trim() || '8';

    liveHR.setAttribute('color-left',  cl);
    liveHR.setAttribute('color-right', cr);
    liveHR.setAttribute('ratio',       ratio);
    liveHR.setAttribute('thickness',   thick);
    liveHR.setAttribute('line-style',  curStyle);
    liveHR.setAttribute('dash',        dash);
    liveHR.setAttribute('gap',         gap);
    liveHR.setAttribute('arrow-size',  asize);
    if (curArrow) liveHR.setAttribute('arrow', curArrow);
    else          liveHR.removeAttribute('arrow');

    const dashLine  = (curStyle === 'dashed' || curStyle === 'dotted')
      ? `\n  dash="${dash}" gap="${gap}"` : '';
    const arrowLine = curArrow ? `\n  arrow="${curArrow}" arrow-size="${asize}"` : '';

    liveCode.textContent =
      `<dual-hr\n  color-left="${cl}" color-right="${cr}"\n` +
      `  ratio="${ratio}" thickness="${thick}"\n` +
      `  line-style="${curStyle}"${dashLine}${arrowLine}\n></dual-hr>`;
  }

  document.getElementById('style-btns').addEventListener('click', e => {
    const btn = e.target.closest('[data-style]');
    if (!btn) return;
    document.querySelectorAll('#style-btns .cfg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curStyle = btn.dataset.style;
    updateLive();
  });

  document.getElementById('arrow-btns').addEventListener('click', e => {
    const btn = e.target.closest('[data-arrow]');
    if (!btn) return;
    document.querySelectorAll('#arrow-btns .cfg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curArrow = btn.dataset.arrow;
    updateLive();
  });

  ['cfg-cl','cfg-cr','cfg-ratio','cfg-thick','cfg-dash','cfg-gap','cfg-asize'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateLive);
    document.getElementById(id).addEventListener('change', updateLive);
  });

  updateLive();
<\/script>
</body>
</html>

</script>

<script>
  // ── 色票格 ─────────────────────────────────────────────────
  const PALETTE_COLORS = {
    shell:'#c6c7bd', violet:'#B484E8', green:'#71CD76',
    red:'#EF6661', energetic:'#B6FF00', blue:'#5DBAE8',
    green:'#71CD76', yellow:'#E3D322', indigo:'#778CE1',
    blue:'#5DBAE8', pink:'#FF91D7', dreamy:'#DE8EC9',
  };
  const grid = document.getElementById('palette-grid');
  Object.entries(PALETTE_COLORS).forEach(([name, hex]) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.innerHTML = `<span class="swatch-dot" style="background:${hex}"></span><span>${name}</span>`;
    grid.appendChild(el);
  });

  // ── 全域配置 Demo ──────────────────────────────────────────
  const presets = {
    A: { colorLeft:'energetic',   colorRight:'blue',    ratio:'6:4', thickness:'2px', lineStyle:'solid'  },
    B: { colorLeft:'violet', colorRight:'blue',      ratio:'5:5', thickness:'2px', lineStyle:'dashed', dash:'8px',  gap:'5px' },
    C: { colorLeft:'green',     colorRight:'energetic',   ratio:'4:6', thickness:'4px', lineStyle:'dotted', dash:'4px',  gap:'4px' },
  };
  function setPreset(key) {
    // 只更新 #api-demo-hr 這一條，示範動態切換
    const el = document.getElementById('api-demo-hr');
    const p  = presets[key];
    el.setAttribute('color-left',  p.colorLeft);
    el.setAttribute('color-right', p.colorRight);
    el.setAttribute('ratio',       p.ratio);
    el.setAttribute('thickness',   p.thickness);
    el.setAttribute('line-style',  p.lineStyle);
    if (p.dash) el.setAttribute('dash', p.dash); else el.removeAttribute('dash');
    if (p.gap)  el.setAttribute('gap',  p.gap);  else el.removeAttribute('gap');
  }
  // 預設套用 A
  setPreset('A');
<\/script>

</body>
</html>

</script>

<script>
(function () {
  /* 每個版本的完整原始 HTML 放在 script[type="text/plain"]，載入時才寫入 iframe。
     原始碼裡的結束 script 標籤與 HTML 註解開頭，為了能放進 script 標籤而被轉義，這裡還原。 */
  var HELPER = '<style>html,body{min-height:0!important;height:auto!important}</style>' +
    '<script>(function(){var id="__ID__",last=0;' +
    'function post(){var h=Math.ceil(document.documentElement.getBoundingClientRect().height);' +
    'if(Math.abs(h-last)>1){last=h;parent.postMessage({demoFrame:id,h:h},"*");}}' +
    'new ResizeObserver(post).observe(document.documentElement);addEventListener("load",post);' +
    'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");' +
    'if(!a)return;e.preventDefault();var k=a.getAttribute("href").slice(1);' +
    'var t=k&&document.getElementById(decodeURIComponent(k));if(t)t.scrollIntoView();});})();<\/script>';
  var frames = document.querySelectorAll('iframe.frame');
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.demoFrame) return;
    var f = document.getElementById(d.demoFrame);
    if (f && !f.classList.contains('fixed')) f.style.height = Math.min(d.h, 30000) + 'px';
  });
  frames.forEach(function (f) {
    var src = document.getElementById(f.dataset.src).textContent
      .replace(/<\\\/script/g, '<' + '/script').replace(/<\\!--/g, '<' + '!--');
    f.srcdoc = src + HELPER.replace('__ID__', f.id);
  });
})();
</script>
</body>
</html>
