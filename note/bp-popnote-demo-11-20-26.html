<div class="page">
  <h1>bp-popnote 摺角便條</h1>
  <p class="sub">在段落加上 <code>data-popover-fold</code>，右上角會出現摺起的紙角。點摺角，便條像紙張翻開一樣展開在段落旁邊，正文位置不動；再點一次摺回去。內容與主題沿用 bp-popnote 原有的 <code>data-popover-title</code>、<code>data-popover-content</code>、<code>data-popover-target</code>、<code>data-popover-theme</code>。新增日期 11-12-26。</p>
  <div id="log"></div>

  <section data-demo>
    <h2>範例一：範文批改，一段一張便條</h2>
    <p class="note">點各段右上角的摺角看評語。下方按鈕呼叫 <code>BpPopnote.foldAll()</code>，一次全部展開或收合，適合複習。</p>
    <div class="stage"></div>
    <pre class="code-box"><code></code></pre>
    <script type="text/plain" class="demo-src">
<div class="ctrl">
  <button type="button" onclick="BpPopnote.foldAll(true, '#essay')">全部展開</button>
  <button type="button" onclick="BpPopnote.foldAll(false, '#essay')">全部收合</button>
</div>
<div id="essay">
  <p data-popover-fold data-popover-title="開頭段"
     data-popover-content="改寫題目而不是照抄：<b>working from home</b> 換成 <b>remote work</b>，並在最後一句清楚表態。">
    In recent years, remote work has become increasingly common. While some argue that it boosts
    productivity, I believe its drawbacks outweigh its benefits for most employees.
  </p>
  <p data-popover-fold data-popover-title="主體段一"
     data-popover-content="主題句清楚，但例子太籠統。加一個具體情境，例如 <i>a parent juggling meetings and childcare</i>。">
    Supporters claim that working from home saves time and allows people to focus.
    Without a daily commute, employees have more energy for their tasks.
  </p>
  <p data-popover-fold data-popover-title="主體段二" data-popover-target="#fb-p3">
    However, remote work blurs the line between work and personal life, which can lead to burnout.
  </p>
</div>

<template id="fb-p3">
  <p>好的論點，可以再展開兩步：</p>
  <ul><li>為什麼界線會模糊：家裡就是辦公室</li><li>結果：難以下班、長期疲勞</li></ul>
</template>
    <\/script>

    <pre class="code-box"><code></code></pre>
    <script type="text/plain" class="demo-src">
<p data-popover-fold data-popover-fold-group="t1" data-popover-fold-width="320"

  Overall, the number of visitors rose steadily, while spending per visitor remained stable.
</p>
<p data-popover-fold data-popover-fold-group="t1" data-popover-fold-width="320"
   data-popover-title="Details" data-popover-content="細節段要比較，不要逐年列數字：<b>twice as many as</b>、<b>by contrast</b>。">

  I learned it mainly because I was tired of eating instant noodles every night.

<p data-popover-fold data-popover-fold-open data-popover-title="預設展開"

    <h2>屬性與 API</h2>
    <table class="ref">
      <thead><tr><th style="width:280px">屬性</th><th style="width:160px">預設</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td><code>data-popover-fold</code></td><td><code>right</code></td><td>開啟摺角便條。<code>right</code>、<code>left</code>、<code>below</code> 決定便條的位置。只寫屬性不給值即為 right。</td></tr>
        <tr><td><code>data-popover-fold-width</code></td><td><code>280px</code></td><td>便條寬度（right、left），純數字視為 px。</td></tr>
        <tr><td><code>data-popover-fold-corner</code></td><td><code>22</code></td><td>摺角大小（px）。</td></tr>
        <tr><td><code>data-popover-fold-group</code></td><td>無</td><td>同組只能同時開一張。</td></tr>
        <tr><td><code>data-popover-fold-open</code></td><td>無</td><td>載入時就展開。</td></tr>
        <tr><td><code>data-popover-title</code>、<code>data-popover-content</code>、<code>data-popover-target</code></td><td></td><td>沿用原有屬性：標題、內容（HTML）、讀取 <code>&lt;template&gt;</code> 的選擇器。</td></tr>
        <tr><td><code>data-popover-theme</code>、<code>data-popover-fontsize</code>、<code>data-popover-border</code></td><td>沿用全域</td><td>沿用原有主題與外觀；摺角顏色跟著主題的框線色。</td></tr>
        <tr><td><code>BpPopnote.fold(el, open)</code></td><td></td><td>開啟或收合單張；省略 <code>open</code> 為切換。<code>el</code> 可以是元素或選擇器。</td></tr>
        <tr><td><code>BpPopnote.foldAll(open, scope)</code></td><td></td><td>一次開啟或收合，<code>scope</code> 可限定範圍。</td></tr>
        <tr><td><code>BpPopnote.initFolds()</code></td><td></td><td>手動初始化；動態插入的段落會自動初始化，通常不需要呼叫。</td></tr>
        <tr><td><code>bpn-fold</code> 事件</td><td></td><td>開合時從段落冒泡，<code>e.detail.open</code> 為 true 或 false。</td></tr>
        <tr><td><code>PopoverConfig.set()</code></td><td></td><td>全域預設：<code>foldSide</code>、<code>foldWidth</code>、<code>foldCorner</code>。</td></tr>
      </tbody>
    </table>
  </section>
</div>

<script>
/* 由同一段原始碼同時產生實例與程式碼，確保範例與程式碼一致 */
(() => {
  const dedent = s => {
    const lines = s.replace(/^\n+|\s+$/g, '').split('\n');
    const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^\s*/)[0].length));
    return lines.map(l => l.slice(ind)).join('\n');
  };
  document.querySelectorAll('[data-demo]').forEach(sec => {
    const src = dedent(sec.querySelector('script.demo-src').textContent);
    sec.querySelector('.code-box code').textContent = src;
    sec.querySelector('.stage').insertAdjacentHTML('beforeend', src);
  });
  /* 用 Bootstrap alert 顯示最近一次開合 */
  document.addEventListener('bpn-fold', e => {
    const t = e.target.getAttribute('data-popover-title') || '便條';
    document.getElementById('log').innerHTML = '<div class="alert alert-dismissible fade show" role="alert">bpn-fold：「' + t + '」' +
      (e.detail.open ? '展開' : '收合') + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button></div>';
  });
})();
<\/script>

(function () {
  /* 每個版本的完整原始 HTML 放在 script[type="text/plain"]，載入時才寫入 iframe。
     原始碼裡的結束 script 標籤與 HTML 註解開頭，為了能放進 script 標籤而被轉義，這裡還原。 */
  var HELPER = '<style>html,body{min-height:0!important;height:auto!important}</style>' +
    '<script>(function(){var id="__ID__",last=0;' +
    'function post(){var h=Math.ceil(document.documentElement.getBoundingClientRect().height);' +
    'if(Math.abs(h-last)>1){last=h;parent.postMessage({demoFrame:id,h:h},"*");}}' +
    'new ResizeObserver(post).observe(document.documentElement);addEventListener("load",post);' +
    'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");' +
    'if(!a)return;e.preventDefault();var k=a.getAttribute("href").slice(1);' +
    'var t=k&&document.getElementById(decodeURIComponent(k));if(t)t.scrollIntoView();});})();<\/script>';
  var frames = document.querySelectorAll('iframe.frame');
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.demoFrame) return;
    var f = document.getElementById(d.demoFrame);
    if (f && !f.classList.contains('fixed')) f.style.height = Math.min(d.h, 30000) + 'px';
  });
  frames.forEach(function (f) {
    var src = document.getElementById(f.dataset.src).textContent
      .replace(/<\\\/script/g, '<' + '/script').replace(/<\\!--/g, '<' + '!--');
    f.srcdoc = src + HELPER.replace('__ID__', f.id);
  });
})();
