<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>info-region 填空題</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
  :root {
    --bg: #0C0D0C; --shell: #C6C7BD; --vanilla: #DBEDD8; --yellow: #E3D322; --pink: #FF91D7;
    --red: #EF6661; --energetic: #B6FF00; --green: #71CD76; --blue: #5DBAE8; --indigo: #778CE1;
    --violet: #B484E8; --gray: #86877F; --line: #2A2B29;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--shell); }
  body { font-family: "微軟正黑體", "Inter", sans-serif; font-size: 1rem; margin: 0; }
  .page { max-width: 1680px; margin: 0 auto; padding: 32px 40px 80px 40px; }
  h1 { color: var(--vanilla); font-size: 2rem; font-weight: 700; margin: 0 0 8px 0; }
  .lead-note { color: var(--gray); margin: 0 0 24px 0; }
  .lead-note code, .demo code { color: var(--yellow); background: transparent; }
  .demo { border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin: 0 0 28px 0; background: #121312; }
  .demo h2 { font-size: 1.35rem; color: var(--blue); margin: 0 0 6px 0; }
  .demo .desc { font-size: 0.95rem; margin: 0 0 16px 0; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .pair-label { font-size: 0.8rem; color: var(--gray); letter-spacing: 0.05em; margin: 0 0 8px 0; }
  pre.code { margin: 0; padding: 16px; border-radius: 8px; background: #1A1B1A; color: var(--vanilla);
             font-size: 0.82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 620px; overflow: auto; }
  .attr-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .attr-table th, .attr-table td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  .attr-table th { color: var(--vanilla); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <h1>info-region：填空題</h1>
  <p class="lead-note">修改日期 11-05-26。測驗區塊新增 <code>&lt;ir-input&gt;</code> 填空題。計分、解說、重試、答對答錯分支都和選擇題共用同一套流程。</p>

  <section class="demo">
    <h2>屬性一覽</h2>
    <table class="attr-table">
      <thead><tr><th>屬性</th><th>寫在哪裡</th><th>預設</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td><code>answer</code></td><td><code>&lt;info-region&gt;</code></td><td>無</td><td>正確答案，多個可接受答案用 <code>|</code> 分隔。忽略前後空白與多餘空格。</td></tr>
        <tr><td><code>case-sensitive</code></td><td><code>&lt;info-region&gt;</code></td><td>無</td><td>區分大小寫。</td></tr>
        <tr><td><code>max-attempts</code></td><td><code>&lt;info-region&gt;</code></td><td><code>1</code></td><td>可嘗試次數。用完前答錯只顯示提示訊息，不計分。</td></tr>
        <tr><td><code>retry-msg</code></td><td><code>&lt;info-region&gt;</code></td><td><code>✗ 再想想。</code></td><td>還有機會時的訊息，後面自動加上剩餘次數。</td></tr>
        <tr><td><code>hint</code>、<code>hint-label</code>、<code>hint-color</code></td><td><code>&lt;info-region&gt;</code></td><td>無、<code>提示</code>、<code>yellow</code></td><td>提示內容、按鈕文字與顏色。有 <code>hint</code> 才出現提示按鈕。</td></tr>
        <tr><td><code>hide-answer</code></td><td><code>&lt;info-region&gt;</code></td><td>無</td><td>最後一次答錯時不顯示正確答案。</td></tr>
        <tr><td><code>placeholder</code></td><td><code>&lt;ir-input&gt;</code></td><td><code>請輸入答案</code></td><td>輸入框提示文字。</td></tr>
        <tr><td><code>submit-label</code></td><td><code>&lt;ir-input&gt;</code></td><td><code>送出</code></td><td>送出按鈕文字。按 Enter 也能送出。</td></tr>
      </tbody>
    </table>
  </section>

  <section class="demo">
    <h2>範例 1：單題填空，三次機會與提示</h2>
    <p class="desc"><code>answer="mitigate|alleviate"</code> 兩個答案都算對；<code>max-attempts="3"</code> 前兩次答錯只提醒，第三次答錯才顯示正確答案。<code>show-retry</code> 讓讀者可以重做。</p>
    <div class="pair">
      <div><p class="pair-label">畫面</p><div class="live" data-tpl="ex1"></div></div>
      <div><p class="pair-label">程式碼</p><pre class="code" data-code="ex1"></pre></div>
    </div>
  </section>

  <section class="demo">
    <h2>範例 2：填空與選擇混合，答錯進補充說明</h2>
    <p class="desc">第 1 題填空答錯時進入補充說明，再回到第 2 題選擇題。上方計分板與進度條同時計算兩種題型。</p>
    <div class="pair">
      <div><p class="pair-label">畫面</p><div class="live" data-tpl="ex2"></div></div>
      <div><p class="pair-label">程式碼</p><pre class="code" data-code="ex2"></pre></div>
    </div>
  </section>
</div>

<template id="ex1">
<info-region-group auto-start show-controls="false">
  <info-region id="f1" quiz color="blue" quiz-label="填空"
               answer="mitigate|alleviate" max-attempts="3" hint="m 開頭，八個字母"
               explain="mitigate the impact of：減輕影響。" show-retry>
    <p>「使某事不那麼嚴重」的動詞是？</p>
    <ir-input placeholder="輸入英文"></ir-input>
  </info-region>
</info-region-group>
</template>

<template id="ex2">
<info-region-group show-score global-progress show-percent progress-color="green">
  <info-region id="m1" quiz quiz-item color="indigo" quiz-label="第 1 題" manual-next
               answer="not much of a morning person" correct-next="m2" wrong-next="m1-help"
               explain="Part 1 回答偏好的常用語塊。">
    <p>Do you like mornings? Honestly, I'm ______.（我不太是早起的人）</p>
    <ir-input placeholder="輸入語塊" submit-label="對答案"></ir-input>
  </info-region>

  <info-region id="m1-help" color="energetic" next="m2" manual manual-label="我懂了 ▶">
    <h4>補充</h4>
    <p><c-green>not much of a ...</c-green> 是委婉的「不太是……」，比 I don't like 更自然。</p>
  </info-region>

  <info-region id="m2" quiz quiz-item color="indigo" quiz-label="第 2 題" answer="b"
               explain="用時間描述距離，比 near 更有畫面。">
    <p>哪一句比較好？</p>
    <ir-choices layout="column">
      <ir-choice value="a">I live near my school.</ir-choice>
      <ir-choice value="b">It's about a ten-minute walk to my school.</ir-choice>
    </ir-choices>
  </info-region>
</info-region-group>
</template>

<script>
  document.querySelectorAll('.live[data-tpl]').forEach(function (box) {
    var tpl = document.getElementById(box.dataset.tpl);
    box.appendChild(tpl.content.cloneNode(true));
    document.querySelector('pre[data-code="' + box.dataset.tpl + '"]').textContent = tpl.innerHTML.trim().replace(/=""/g, '');
  });
<\/script>
<script src="info-region.js"><\/script>
</body>
</html>

</script>

<div class="layout">

<main>
<h1>info-region 範例</h1>
<p class="lead">每個範例進入畫面時才開始播放，可按「重新播放」重來。展開「顯示原始碼」即可看到對應的 HTML。需與 info-region.js 放在同一資料夾。</p>
<section class="demo" id="d1">
<h2>1. 自動揭露鏈</h2><p class="desc">只有 a 寫 active，其餘由 next 串起。b 的 next-interval 為 1200，最後一個是 ir-gold 收尾。</p>
<div class="bar"><button class="rbtn" data-replay="d1">↻ 重新播放</button></div>
<div class="stage" id="stage-d1"></div>
<details><summary>顯示原始碼</summary><pre><code>&lt;info-region id="d1-a" active="true" next="d1-b" color="blue"&gt;
  &lt;h5&gt;第一步&lt;/h5&gt;&lt;p&gt;載入就展開，0.5 秒後自動帶出下一段。&lt;/p&gt;
&lt;/info-region&gt;
&lt;info-region id="d1-b" next="d1-c" next-interval="1200" color="blue"&gt;
  &lt;p&gt;等了 1.2 秒才帶出最後一段。&lt;/p&gt;
&lt;/info-region&gt;
&lt;info-region id="d1-c" class="ir-gold"&gt;
  &lt;h5&gt;結尾&lt;/h5&gt;&lt;p&gt;金箔特別版，用在序列的最後。&lt;/p&gt;
&lt;/info-region&gt;</code></pre></details>
</section>
<section class="demo" id="d2">
<h2>2. 倒數</h2><p class="desc">顯示倒數條，歸零後啟用 next。上方黃色 3 秒，下方只寫 countdown 為 2 秒。</p>
<div class="bar"><button class="rbtn" data-replay="d2">↻ 重新播放</button></div>
<div class="stage" id="stage-d2"></div>
<details><summary>顯示原始碼</summary><pre><code>&lt;info-region id="d2-a" active="true" countdown="3000" countdown-position="top"
             countdown-color="yellow" countdown-height="5" next="d2-b" color="energetic"&gt;
  &lt;p&gt;先讀這一段，3 秒後自動下一段。&lt;/p&gt;
&lt;/info-region&gt;
&lt;info-region id="d2-b" countdown next="d2-c" color="green"&gt;
  &lt;p&gt;只寫 countdown，預設 2 秒。&lt;/p&gt;
&lt;/info-region&gt;
&lt;info-region id="d2-c" color="green"&gt;&lt;p&gt;倒數結束。&lt;/p&gt;&lt;/info-region&gt;</code></pre></details>
</section>
<section class="demo" id="d3">
<h2>3. 手動繼續</h2><p class="desc">按鈕文字、顏色、位置可自訂。按下後按鈕消失，下一段出現。</p>
<div class="bar"><button class="rbtn" data-replay="d3">↻ 重新播放</button></div>
<div class="stage" id="stage-d3"></div>
<details><summary>顯示原始碼</summary><pre><code>&lt;info-region id="d3-a" active="true" manual next="d3-b" manual-label="我讀完了"
             manual-color="green" manual-align="center" color="green"&gt;
  &lt;p&gt;讀完請按下方按鈕。&lt;/p&gt;
&lt;/info-region&gt;
&lt;info-region id="d3-b" manual next="d3-c" manual-align="left" color="violet"&gt;
  &lt;p&gt;預設標籤是「▶ 下一步」，這裡靠左。&lt;/p&gt;
&lt;/info-region&gt;
&lt;info-region id="d3-c" color="pink"&gt;&lt;p&gt;完成。&lt;/p&gt;&lt;/info-region&gt;</code></pre></details>
</section>
<section class="demo" id="d4">
<h2>4. 色票與邊框</h2><p class="desc">橫向群組把全部色票排成格子，後面三個示範邊框寫法。</p>
<div class="bar"><button class="rbtn" data-replay="d4">↻ 重新播放</button></div>
<div class="stage" id="stage-d4"></div>
<details><summary>顯示原始碼</summary><pre><code>&lt;info-region-group layout="horizontal" cols-per-row="4" row-gap="12px" show-controls="false" cascade-interval="80" auto-start&gt;
  &lt;info-region color="shell"&gt;&lt;p&gt;shell&lt;/p&gt;&lt;/info-region&gt;

  &lt;info-region color="red"&gt;&lt;p&gt;warning&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="energetic"&gt;&lt;p&gt;energetic&lt;/p&gt;&lt;/info-region&gt;

  &lt;info-region color="green"&gt;&lt;p&gt;green&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="green"&gt;&lt;p&gt;green&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="vanilla"&gt;&lt;p&gt;vanilla&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="yellow"&gt;&lt;p&gt;yellow&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="vanilla"&gt;&lt;p&gt;focus&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="indigo"&gt;&lt;p&gt;info&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="indigo"&gt;&lt;p&gt;indigo&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="pink"&gt;&lt;p&gt;pink&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="energetic"&gt;&lt;p&gt;energetic&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="green"&gt;&lt;p&gt;green&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="blue"&gt;&lt;p&gt;blue&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="gold"&gt;&lt;p&gt;gold&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="energetic" border-width="2" border-style="dashed"&gt;&lt;p&gt;四邊 2px 虛線&lt;/p&gt;&lt;/info-region&gt;
  &lt;info-region color="green" border-width="0" border-top-width="6"&gt;&lt;p&gt;只有上邊 6px&lt;/p&gt;&lt;/info-region&gt;
&lt;/info-region-group&gt;</code></pre></details>
</section>
<section class="demo" id="d5">
<h2>5. 單題測驗</h2><p class="desc">explain 接受 HTML，show-retry 可重試，答對後 800 毫秒出現說明。選項為 layout=&quot;column&quot;。</p>

<script>
(function(){
  function render(id){
    var st=document.getElementById('stage-'+id), tp=document.getElementById('tpl-'+id);
    st.innerHTML='';
    st.appendChild(tp.content.cloneNode(true));
  }
  var ids=['d1', 'd2', 'd3', 'd4', 'd5', 'd6', 'd7', 'd8'], seen={};
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      var id=e.target.getAttribute('data-id');
      if(e.isIntersecting && !seen[id]){seen[id]=1;render(id);}
    });
  },{threshold:0.3});
  ids.forEach(function(id){io.observe(document.getElementById(id));
    document.getElementById(id).setAttribute('data-id',id);});
  document.querySelectorAll('[data-replay]').forEach(function(b){
    b.addEventListener('click',function(){render(b.getAttribute('data-replay'));});
  });
  function note(t){
    document.getElementById('d9-alert').innerHTML='<div class="alert alert-info py-2 mb-2">'+t+'</div>';
  }
  document.getElementById('b-a').onclick=function(){InfoRegion.activate('d9-a');note('已呼叫 InfoRegion.activate("d9-a")。');};
  document.getElementById('b-b').onclick=function(){InfoRegion.activate('d9-b');note('已呼叫 InfoRegion.activate("d9-b")。');};
  document.getElementById('b-r').onclick=function(){InfoRegion.resetAll('#stage-d9 info-region');note('已呼叫 InfoRegion.resetAll("#stage-d9 info-region")。');};
})();

<script>
(function () {
  /* 每個版本的完整原始 HTML 放在 script[type="text/plain"]，載入時才寫入 iframe。
     原始碼裡的結束 script 標籤與 HTML 註解開頭，為了能放進 script 標籤而被轉義，這裡還原。 */
  var HELPER = '<style>html,body{min-height:0!important;height:auto!important}</style>' +
    '<script>(function(){var id="__ID__",last=0;' +
    'function post(){var h=Math.ceil(document.documentElement.getBoundingClientRect().height);' +
    'if(Math.abs(h-last)>1){last=h;parent.postMessage({demoFrame:id,h:h},"*");}}' +
    'new ResizeObserver(post).observe(document.documentElement);addEventListener("load",post);' +
    'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");' +
    'if(!a)return;e.preventDefault();var k=a.getAttribute("href").slice(1);' +
    'var t=k&&document.getElementById(decodeURIComponent(k));if(t)t.scrollIntoView();});})();<\/script>';
  var frames = document.querySelectorAll('iframe.frame');
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.demoFrame) return;
    var f = document.getElementById(d.demoFrame);
    if (f && !f.classList.contains('fixed')) f.style.height = Math.min(d.h, 30000) + 'px';
  });
  frames.forEach(function (f) {
    var src = document.getElementById(f.dataset.src).textContent
      .replace(/<\\\/script/g, '<' + '/script').replace(/<\\!--/g, '<' + '!--');
    f.srcdoc = src + HELPER.replace('__ID__', f.id);
  });
})();
</script>
