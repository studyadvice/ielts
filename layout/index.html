<div class="page">

  <h1>&lt;ui-cards&gt; 卡片牆元件</h1>
  <p class="lead-text">卡片以網格排列，內容可直接寫在 <code>&lt;card-item&gt;</code> 裡，或用 <code>source</code> 複製。帶 <code>detail</code> 的卡片或卡片內元素，會在內容區顯示對應內容。屬性約定見 <a href="ui-conventions.html">ui-conventions.html</a>。</p>

  <h2>版本紀錄</h2>
  <div class="ver"><strong>v1.0（11-03-26）</strong>　初版。</div>

  <!-- ===================== 範例一 ===================== -->
  <h2>範例一：圖示卡片，內容區在下方</h2>
  <p class="note">每張卡片有圖示、名稱、說明、標籤與頁尾，<code>divider</code> 在頁尾上方畫虛線。整張卡片帶 <code>detail</code>，點擊後內容區顯示對應內容；<code>toggle</code> 讓再點一次收起。</p>
  <div class="demo-live" id="demo1"></div>
  <pre class="demo-code" id="demo1-code"></pre>
  <script type="text/plain" data-demo="demo1">
<ui-cards title="服務項目" cols="3" divider="dashed" toggle
  panel-title="{label}" accent="blue">
  <card-item label="網站設計" note="形象網站、活動頁" icon="palette-fill" color="violet"
    tags="RWD,SEO" footer="約 4 週" detail="c1-web"></card-item>
  <card-item label="系統開發" note="後台、會員、金流" icon="cpu-fill" color="blue"
    tags="PHP,MySQL" footer="約 8 週" detail="c1-sys" badge="熱門"></card-item>
  <card-item label="維護代管" note="主機、備份、更新" icon="shield-check" color="green"
    tags="月費" footer="按月計費" detail="c1-care"></card-item>
</ui-cards>

<div id="c1-web" hidden><p>包含版面設計、切版與上線，提供兩次修改。</p></div>
<div id="c1-sys" hidden><p>依需求規劃資料表與後台，含操作日誌與權限管理。</p></div>
<div id="c1-care" hidden><p>每月備份、安全更新與流量報告。</p></div>
  </script>

  <!-- ===================== 範例二 ===================== -->
  <h2>範例二：圖片在左，內容區在右</h2>
  <p class="note"><code>media-position="left"</code> 讓圖片放在左側，<code>panel="right"</code> 讓內容區固定在右側。卡片內的按鈕也可以帶 <code>detail</code>，並用 <code>color</code> 指定配色。第三張卡片跨兩欄，最後一張停用，另一張是外部連結。</p>
  <div class="demo-live" id="demo2"></div>
  <pre class="demo-code" id="demo2-code"></pre>
  <script type="text/plain" data-demo="demo2">
<ui-cards cols="2" media-position="left" media-width="140" panel="right" panel-columns="8,4"
  panel-title="詳細資料" placeholder="點卡片或卡片內的按鈕。" accent="pink" bordered
  active-detail="c2-a">
  <card-item label="山景木屋" note="南投 · 兩人房" image="https://picsum.photos/seed/cabin/400/300"
    detail="c2-a" tags="景觀,早餐">
    <p>每晚 3,200 元起。</p>
  </card-item>
  <card-item label="海邊民宿" note="墾丁 · 四人房" image="https://picsum.photos/seed/beach/400/300"
    badge="剩 2 間">
    <p>每晚 4,800 元起。</p>
    <button detail="c2-b-room">房型</button>
    <button detail="c2-b-rule" color="energetic" detail-title="入住須知">須知</button>
  </card-item>
  <card-item span="2" label="城市旅店" note="台北 · 商務房，步行 3 分鐘到捷運"
    image="https://picsum.photos/seed/city/400/300" detail="c2-c" color="blue">
    <p>平日每晚 2,600 元，週末 3,000 元。</p>
  </card-item>
  <card-item label="合作平台" note="另開視窗" icon="box-arrow-up-right" color="energetic"
    href="https://getbootstrap.com" target="_blank"></card-item>
  <card-item label="湖畔營地" note="整修中" icon="tree-fill" disabled detail="c2-a"></card-item>
</ui-cards>

<template id="c2-a"><p>木屋有獨立陽台，早餐為在地食材。</p></template>
<template id="c2-b-room"><ul><li>四人和室</li><li>四人雙床</li></ul></template>
<template id="c2-b-rule"><p>入住 15:00，退房 11:00，禁止寵物。</p></template>
<template id="c2-c"><p>提供會議室與洗衣服務。</p></template>
  </script>

  <!-- ===================== 範例三 ===================== -->
  <h2>範例三：實心卡片，置中排列，不帶內容區</h2>
  <p class="note"><code>card-style="filled"</code> 以卡片顏色當底色，<code>align="center"</code> 置中，<code>card-height</code> 統一最小高度。卡片內容用 <code>source</code> 從同一份來源複製。<code>panel="none"</code> 時不建立內容區。</p>

  <pre class="demo-code" id="demo3-code"></pre>

<ui-cards cols="4" gap="12" card-style="filled" align="center" card-height="180" icon-size="2.4"

  <card-item label="今日訂單" icon="cart-check-fill" color="blue" source="c3-a"></card-item>
  <card-item label="新會員" icon="person-plus-fill" color="green" source="c3-b"></card-item>
  <card-item label="待出貨" icon="box-seam-fill" color="yellow" source="c3-c"></card-item>
  <card-item label="退貨申請" icon="arrow-return-left" color="energetic" source="c3-d" badge="新"></card-item>
</ui-cards>

<template id="c3-a"><p style="font-size:1.6rem;font-weight:700;">128</p></template>

  <h2>屬性一覽</h2>

  <h3>容器 &lt;ui-cards&gt;</h3>
  <table class="table table-sm ref">
    <thead><tr><th>屬性</th><th>預設</th><th>說明</th></tr></thead>
    <tbody>
      <tr><td>title</td><td>無</td><td>元件標題</td></tr>
      <tr><td>cols</td><td>3</td><td>每列卡片數</td></tr>
      <tr><td>gap</td><td>16</td><td>卡片間距（px）</td></tr>
      <tr><td>card-style</td><td>outline</td><td>outline（外框）、filled（實心）、plain（無框）</td></tr>
      <tr><td>card-padding</td><td>16</td><td>卡片內距（px）</td></tr>
      <tr><td>card-radius</td><td>8</td><td>卡片圓角（px）</td></tr>
      <tr><td>card-height</td><td>自動</td><td>卡片最小高度（px）</td></tr>
      <tr><td>align</td><td>left</td><td>left、center</td></tr>
      <tr><td>media-position</td><td>top</td><td>圖片或圖示位置：top、left</td></tr>
      <tr><td>media-height</td><td>140</td><td>圖片在上方時的高度（px）</td></tr>
      <tr><td>media-width</td><td>120</td><td>圖片在左側時的寬度（px）</td></tr>
      <tr><td>icon-size</td><td>2</td><td>圖示大小（rem）</td></tr>
      <tr><td>color</td><td>shell</td><td>卡片主色（外框、名稱、圖示，實心時為底色）</td></tr>
      <tr><td>icon-color</td><td>同 color</td><td>圖示顏色；實心卡片預設為底層背景色</td></tr>
      <tr><td>accent</td><td>blue</td><td>選中卡片的外框色</td></tr>
      <tr><td>divider</td><td>不顯示</td><td>頁尾上方分隔線：solid、dashed、dotted</td></tr>
      <tr><td>divider-color</td><td>同 color</td><td>分隔線顏色</td></tr>
      <tr><td>bordered</td><td>否</td><td>整個元件外框</td></tr>
      <tr><td>panel</td><td>below</td><td>內容區位置：below、right、none</td></tr>
      <tr><td>panel-columns</td><td>8,4</td><td>內容區在右側時，卡片區與內容區比例</td></tr>
      <tr><td>panel-title</td><td>無</td><td>內容區標題，可用 {label}</td></tr>
      <tr><td>panel-height</td><td>無</td><td>內容區最大高度（px），超出時捲動</td></tr>
      <tr><td>placeholder</td><td>請點選卡片。</td><td>未選擇時的提示</td></tr>
      <tr><td>hide-empty-panel</td><td>否</td><td>內容區沒有內容時隱藏</td></tr>
      <tr><td>active-detail</td><td>無</td><td>初始開啟的 detail</td></tr>
      <tr><td>trigger、detail-trigger</td><td>click</td><td>卡片、卡片內元素的觸發方式：click、hover</td></tr>
      <tr><td>toggle</td><td>否</td><td>再點一次已開啟的卡片時收起</td></tr>
      <tr><td>button-color</td><td>blue</td><td>帶 detail 元素的預設按鈕配色</td></tr>
    </tbody>
  </table>

  <h3>卡片 &lt;card-item&gt;</h3>
  <table class="table table-sm ref">
    <thead><tr><th>屬性</th><th>說明</th></tr></thead>
    <tbody>
      <tr><td>label、note、tooltip</td><td>名稱、次要文字、滑鼠提示</td></tr>
      <tr><td>icon、image</td><td>圖示或圖片網址，兩者擇一，image 優先</td></tr>

      <tr><td>tags</td><td>以逗號分隔的標籤</td></tr>
      <tr><td>footer</td><td>頁尾文字</td></tr>
      <tr><td>color、icon-color</td><td>本卡片主色、圖示顏色</td></tr>
      <tr><td>span</td><td>跨幾欄</td></tr>
      <tr><td>source</td><td>複製到卡片內文的內容，接在卡片原有內容之後</td></tr>
      <tr><td>detail、detail-title</td><td>點擊卡片時在內容區顯示的內容與標題</td></tr>

      <tr><td>disabled</td><td>停用</td></tr>
      <tr><td>href、target</td><td>改為連結</td></tr>

  </table>

  <h3>卡片內或內容區裡的觸發元素</h3>
  <table class="table table-sm ref">

    <tbody>

      <tr><td>toggle</td><td>再按一次收起</td></tr>
      <tr><td>detail-title</td><td>內容區標題</td></tr>
    </tbody>
  </table>

  // 示範頁專用：同一份原始碼同時渲染成元件與程式碼區塊
  document.querySelectorAll('script[type="text/plain"][data-demo]').forEach(src => {
    const lines = src.textContent.replace(/^\n+|\s+$/g, '').split('\n');
    const indent = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    const code = lines.map(l => l.slice(indent)).join('\n');
    document.getElementById(src.dataset.demo).innerHTML = code;
    document.getElementById(src.dataset.demo + '-code').textContent = code;
  });
</script>

<script>
  /* 依 template 同時產生畫面與程式碼，兩邊永遠一致 */
  document.querySelectorAll('.live[data-tpl]').forEach(function (box) {
    var tpl = document.getElementById(box.dataset.tpl);
    box.appendChild(tpl.content.cloneNode(true));
    var code = document.querySelector('pre[data-code="' + box.dataset.tpl + '"]');
    code.textContent = tpl.innerHTML.trim().replace(/=""/g, '');
  });

  function showAlert(msg, kind) {
    var box = document.getElementById('alerts');
    var div = document.createElement('div');
    div.className = 'alert alert-' + (kind || 'info') + ' alert-dismissible fade show';
    div.setAttribute('role', 'alert');
    div.textContent = msg;
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'btn-close';
    close.setAttribute('data-bs-dismiss', 'alert');
    div.appendChild(close);
    box.appendChild(div);
    setTimeout(function () { div.classList.remove('show'); setTimeout(function () { div.remove(); }, 200); }, 3200);
  }

  document.getElementById('btn-unflip').addEventListener('click', function () {
    document.querySelector('#live-ex9 ui-cards').unflipAll();
    showAlert('已全部翻回正面。', 'info');
  });
  document.addEventListener('ui-cards:flip', function (e) {
    if (e.detail.flipped && e.target.closest('#live-ex9')) showAlert('翻面：' + e.detail.card.getAttribute('label'), 'info');
  });

  document.getElementById('btn-which').addEventListener('click', function () {
    var on = document.querySelector('#live-ex3 card-item[data-active]');
    showAlert(on ? '目前選中：' + on.getAttribute('label') : '目前沒有選中的卡片。', on ? 'info' : 'warning');

<script>
  // 示範頁專用：同一份原始碼同時渲染成元件與程式碼區塊
  document.querySelectorAll('script[type="text/plain"][data-demo]').forEach(src => {
    const lines = src.textContent.replace(/^\n+|\s+$/g, '').split('\n');
    const indent = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    const code = lines.map(l => l.slice(indent)).join('\n');
    document.getElementById(src.dataset.demo).innerHTML = code;
    document.getElementById(src.dataset.demo + '-code').textContent = code;
  });
</script>
</template>

<script>
(function () {
  var MARK = '<!-- ===== body ===== -->';
  var frame = document.getElementById('stage');
  var parts = Array.prototype.slice.call(document.querySelectorAll('template[data-part]'));
  var btns = Array.prototype.slice.call(document.querySelectorAll('[data-go]'));

  function show(id, push) {
    var t = document.getElementById(id) || parts[0];
    var src = t.innerHTML;
    var i = src.indexOf(MARK);
    var head = i >= 0 ? src.slice(0, i) : '';
    var body = i >= 0 ? src.slice(i + MARK.length) : src;
    /* srcdoc 的相對路徑以本頁為準，所以元件的 js 照原樣載入 */
    frame.srcdoc = '<!doctype html><html ' + (t.dataset.htmlAttrs || '') + '><head>' + head +
      '</head><body>' + body + '</body></html>';
    document.getElementById('now').textContent = t.dataset.component + '　' + t.dataset.date + '　' + t.dataset.title;
    document.getElementById('from').textContent = '原檔 ' + t.dataset.from;
    btns.forEach(function (b) { b.classList.toggle('on', b.dataset.go === t.id); });
    if (push && location.hash !== '#' + t.id) history.replaceState(null, '', '#' + t.id);
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.go, true); });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1) || parts[parts.length - 1].id, false);
})();
</script>
